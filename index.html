<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- SEO Keywords & Search Description -->
    <title>Warp | Starfield Visualization and Ambient Engine Noise | Star Trek TNG</title>
    <meta name="description" content="Procedural starfield and ambient low-frequency engine rumble inspired by Star Trek TNG. Perfect for study, focus, or sleep.">
    <meta name="keywords" content="Star Trek ambient noise, Enterprise D engine hum, Engineering background sound, Warp core white noise, Star Trek sleep sound, Web Audio synthesizer">

    <!-- Open Graph / Social Media Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Star Trek Warp Starfield Ambient Sound">
    <meta property="og:description" content="Experience the iconic engine hum of the Galaxy-class starship. Includes interactive controls for engine rumble and starfield speed.">
    <meta property="og:url" content="https://m-spangenberg.github.io/warp/">
    <meta property="og:image" content="https://m-spangenberg.github.io/warp/warp-github-social-media-preview.jpeg">

    <!-- Twitter Card Data -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Warp - Starfield & Ambient Engine Sound Generator - Star Trek TNG">
    <meta name="twitter:description" content="Procedural engine hum & starfield visualization to help with sleep.">
    <meta name="twitter:image" content="https://m-spangenberg.github.io/warp/warp-github-social-media-preview.jpeg">

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Warp">
    <style>
        /* Theme accents. `body.borg` (the hidden easter egg) overrides the
           whole set to green - every glow, border, and button picks it up. */
        :root {
            --glow-near: rgba(130, 180, 255, 0.55);
            --glow-far: rgba(70, 130, 255, 0.7);
            --accent-line: rgba(130, 180, 255, 0.35);
            --accent-shadow: rgba(70, 130, 255, 0.28);
            --accent-faint: rgba(130, 180, 255, 0.25);
            --accent-scroll: rgba(130, 180, 255, 0.3);
            --accent-focus: rgba(130, 180, 255, 0.7);
            --accent-text: rgba(200, 220, 255, 0.75);
            --btn-grad-a: #8ab8ff;
            --btn-grad-b: #4a7dff;
        }

        body.borg {
            --glow-near: rgba(140, 255, 170, 0.55);
            --glow-far: rgba(60, 220, 130, 0.7);
            --accent-line: rgba(140, 255, 170, 0.35);
            --accent-shadow: rgba(60, 220, 130, 0.28);
            --accent-faint: rgba(140, 255, 170, 0.25);
            --accent-scroll: rgba(140, 255, 170, 0.3);
            --accent-focus: rgba(140, 255, 170, 0.7);
            --accent-text: rgba(200, 255, 220, 0.75);
            --btn-grad-a: #9dffbe;
            --btn-grad-b: #3ddc84;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Edge glow (slider-controlled) - same hues as the install CTA's glow. */
        .edge-glow {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            box-shadow:
                inset 0 0 60px 12px var(--glow-near),
                inset 0 0 190px 55px var(--glow-far);
            transition: box-shadow 0.8s ease;
        }

        /* Centered, scrollable control sheet - the same layout on desktop
           and mobile (the media query below only re-sizes for small screens). */
        .settings {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            max-width: 92vw;
            max-height: 84vh;
            overflow-y: auto;
            background: rgba(14, 20, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 1.1rem 1.25rem 1.25rem;
            z-index: 10;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            gap: 0.9rem;
            transition: opacity 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            opacity: 0;
            pointer-events: none;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-scroll) transparent;
        }

        .settings::-webkit-scrollbar {
            width: 4px;
        }

        .settings::-webkit-scrollbar-thumb {
            background: var(--accent-scroll);
            border-radius: 2px;
        }

        /* Open state - toggled from the tiny icon in the top-right.
           Same glow as the install CTA. */
        .settings.open {
            opacity: 1;
            pointer-events: auto;
            border-color: var(--accent-line);
            box-shadow: 0 10px 34px var(--accent-shadow);
        }

        .settings-section {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0.85rem;
        }

        .settings-divider {
            width: auto;
            height: 1px;
            margin: 0.1rem 0;
            background: var(--accent-faint);
        }

        .settings-meta {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }

        /* Tiny toggle icon in the top-right corner - the only always-visible
           hint that controls exist (same faint opacity as the old hidden panel). */
        .panel-toggle {
            position: fixed;
            top: calc(0.75rem + env(safe-area-inset-top, 0px));
            right: calc(0.75rem + env(safe-area-inset-right, 0px));
            z-index: 20;
            width: 2.25rem;
            height: 2.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(14, 20, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            opacity: 0.05;
            transition: opacity 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* While the panel is open the icon is fully visible and doubles
           as the close control. */
        body.panel-open .panel-toggle {
            opacity: 1;
            border-color: var(--accent-line);
            box-shadow: 0 10px 34px var(--accent-shadow);
        }

        .toggle:focus-visible,
        .reset-btn:focus-visible,
        .panel-toggle:focus-visible,
        .chip:focus-visible,
        .layer-chev:focus-visible {
            outline: 2px solid var(--accent-focus);
            outline-offset: 2px;
        }

        /* Small screens: the same sheet, sized to leave the starfield
           visible around it. */
        @media (max-width: 700px) {
            .settings {
                width: calc(100vw - 2rem);
                max-width: 420px;
                max-height: 72vh;
                -webkit-overflow-scrolling: touch;
            }
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        .setting-group label {
            flex: 0 0 5.5rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .toggle-row {
            justify-content: space-between;
        }

        .reset-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            padding: 0.35rem 0.65rem;
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.2s, border-color 0.2s;
        }

        .reset-btn:hover {
            color: #fff;
            border-color: var(--accent-focus);
        }

        .version-tag {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            white-space: nowrap;
        }

        input[type="range"] {
            flex: 1;
            min-width: 0;
            accent-color: #fff;
        }

        .display-val {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            min-width: 40px;
            text-align: right;
        }

        .toggle {
            width: 40px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            transition: left 0.3s;
        }

        .toggle.active {
            background: rgba(255, 255, 255, 0.6);
        }

        .toggle.active::after {
            left: 22px;
        }

        /* --- Warp factor presets (chip row) --- */
        .chip-row {
            flex: 1;
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .chip {
            font-size: 0.72rem;
            padding: 0.28rem 0.6rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            background: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.2s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .chip:hover {
            color: #fff;
            border-color: var(--accent-focus);
        }

        .chip.active {
            color: #fff;
            border-color: var(--accent-focus);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px var(--accent-shadow);
        }

        /* --- Sound layers (auto-generated from the sound bank) --- */
        .layer-rows {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .layer-row {
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
        }

        .layer-head {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.6rem;
        }

        .layer-label {
            flex: 1;
            font-size: 0.85rem;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .layer-chev {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            line-height: 1;
            padding: 0.3rem 0.35rem;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }

        .layer-chev:hover {
            color: #fff;
        }

        .layer-chev[aria-expanded="true"] {
            transform: rotate(180deg);
        }

        .layer-body {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            padding: 0.2rem 0.6rem 0.65rem;
        }

        .layer-flavor {
            font-size: 0.72rem;
            font-style: italic;
            color: var(--accent-text);
        }

        .layer-body .setting-group label {
            flex-basis: 4.5rem;
        }

        /* --- Counselor's Corner (daily quote) --- */
        .counselor {
            gap: 0.25rem;
        }

        .counselor-head {
            font-size: 0.65rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }

        .counselor-quote {
            font-size: 0.8rem;
            font-style: italic;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.85);
        }

        .counselor-attr {
            font-size: 0.72rem;
            color: var(--accent-text);
        }

        /* --- Install CTA (first launch, dismissible) --- */
        .install-cta {
            position: fixed;
            left: 50%;
            bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%) translateY(150%);
            z-index: 100;
            max-width: 92vw;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.45s ease;
        }

        .install-cta.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .install-cta-card {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            background: rgba(14, 20, 30, 0.92);
            border: 1px solid var(--accent-line);
            border-radius: 14px;
            padding: 0.65rem 0.65rem 0.65rem 1.1rem;
            box-shadow: 0 10px 34px var(--accent-shadow);
            backdrop-filter: blur(12px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .install-cta-text {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            min-width: 0;
        }

        .install-cta-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .install-cta-sub {
            font-size: 0.78rem;
            color: var(--accent-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .install-cta-btn {
            background: linear-gradient(135deg, var(--btn-grad-a), var(--btn-grad-b));
            color: #05101f;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            border-radius: 999px;
            padding: 0.55rem 1.25rem;
            cursor: pointer;
            white-space: nowrap;
            transition: filter 0.2s;
        }

        .install-cta-btn:hover {
            filter: brightness(1.12);
        }

        .install-cta-dismiss {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
            line-height: 1;
            padding: 0.45rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .install-cta-dismiss:hover {
            color: #fff;
        }

        @media (max-width: 520px) {
            .install-cta-sub {
                display: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="warpCanvas"></canvas>
    <div class="edge-glow" id="edgeGlow"></div>

    <button class="panel-toggle" id="panelToggle" aria-label="Show controls" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <line x1="2.5" y1="5.5" x2="15.5" y2="5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="2.5" y1="12.5" x2="15.5" y2="12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="11.5" cy="5.5" r="2.4" fill="rgba(14, 20, 30, 0.92)" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="6.5" cy="12.5" r="2.4" fill="rgba(14, 20, 30, 0.92)" stroke="currentColor" stroke-width="1.5"/>
        </svg>
    </button>

    <div class="settings">
        <!-- Starfield -->
        <div class="settings-section">
            <div class="setting-group">
                <label for="speedRange">Speed</label>
                <input type="range" id="speedRange" min="1" max="20" value="15">
                <span class="display-val" id="speedDisplay">15x</span>
            </div>

            <div class="setting-group">
                <label for="countRange">Stars</label>
                <input type="range" id="countRange" min="100" max="2000" step="100" value="800">
                <span class="display-val" id="countDisplay">800</span>
            </div>

            <div class="setting-group toggle-row">
                <label for="trailsToggle">Trails</label>
                <div class="toggle" id="trailsToggle" role="switch" tabindex="0" aria-checked="false" aria-label="Trails"></div>
            </div>

            <div class="setting-group toggle-row">
                <label for="rearViewToggle">Rear View</label>
                <div class="toggle" id="rearViewToggle" role="switch" tabindex="0" aria-checked="false" aria-label="Rear View"></div>
            </div>

            <div class="setting-group">
                <label for="aberrationRange">Aberration</label>
                <input type="range" id="aberrationRange" min="0" max="1" step="0.01" value="0">

            <div class="setting-group">
                <label for="edgeGlowRange">Edge Glow</label>

        <div class="settings-divider" aria-hidden="true"></div>

        <!-- Soundscape -->
        <div class="settings-section">
            <div class="setting-group toggle-row">

                <div class="toggle" id="soundToggle" role="switch" tabindex="0" aria-checked="false" aria-label="Sound"></div>
            </div>

            <div class="setting-group">

            <div class="setting-group">
                <label for="masterRange">Master</label>

            <div class="setting-group">
                <label for="reverbMixRange">Reverb Room</label>
                <input type="range" id="reverbMixRange" min="0" max="1" step="0.05" value="1.0">
                <span class="display-val" id="reverbDisplay">100%</span>
            </div>

            <div class="setting-group">
                <label for="chorusMixRange">Chorus Motion</label>
                <input type="range" id="chorusMixRange" min="0" max="1" step="0.05" value="0.80">
                <span class="display-val" id="chorusDisplay">80%</span>
            </div>

            <!-- Sound layers (auto-generated from the sound bank in sounds/) -->
            <div class="layer-rows" id="layerRows"></div>

        <div class="settings-divider" aria-hidden="true"></div>

        <!-- Counselor's Corner (daily quote from data/quotes.txt) -->
        <div class="settings-section counselor" id="counselorCorner" hidden>
            <div class="counselor-head">Counselor's Corner</div>
            <p class="counselor-quote" id="counselorQuote"></p>
            <p class="counselor-attr" id="counselorAttr"></p>

        <div class="settings-divider" aria-hidden="true"></div>

        <div class="settings-section settings-meta">
            <span class="version-tag" id="versionTag" title="Version">v0.1.0</span>

    <!-- PWA Install CTA (shown on first launch, tap anywhere on it to dismiss) -->
    <div class="install-cta" id="installCta" aria-live="polite">
        <div class="install-cta-card" id="installCtaCard" title="Tap to dismiss">
            <div class="install-cta-text">
                <span class="install-cta-title" id="installCtaTitle">Install Warp</span>
                <span class="install-cta-sub" id="installCtaSub">Run offline, full-screen, from your home screen</span>
            </div>
            <button class="install-cta-btn" id="installCtaInstall">Install</button>
            <button class="install-cta-dismiss" id="installCtaDismiss" aria-label="Dismiss install prompt">✕</button>
        </div>
    </div>

    <script type="module">
        import { SOUND_BANK } from './sounds/bank.js';
        import { WarpEngine } from './sounds/engine.js';
        import { WARP_PRESETS } from './presets/warp.js';

        // Release version - keep in sync with CHANGELOG.md
        const APP_VERSION = '0.3.0';

        const canvas = document.getElementById('warpCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, centerX, centerY;

        function resize() {
            // Render at device resolution so stars stay sharp on high-DPI
            // screens (capped at 2x to keep high star counts fast).
            const dpr = Math.min(2, window.devicePixelRatio || 1);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            centerX = width / 2;
            centerY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        let STAR_COUNT = 800;
        const MAX_DEPTH = 1500;
        const FOCAL_LENGTH = 400;
        let speed = 15;
        let showTrails = false;
        let rearView = false;
        let aberration = 0;

        class Star {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = (Math.random() - 0.5) * width * 3;
                this.y = (Math.random() - 0.5) * height * 3;
                // Front view: stars are born far away (near the center) and
                // approach the camera. Rear view: stars are born close, just
                // outside the edge of view, and recede toward the center.
                if (initial) {
                    this.z = Math.random() * MAX_DEPTH;
                } else {
                    this.z = rearView ? 1 + Math.random() * MAX_DEPTH * 0.02 : MAX_DEPTH;
                }
                this.px = centerX + (this.x / this.z) * FOCAL_LENGTH;
                this.py = centerY + (this.y / this.z) * FOCAL_LENGTH;
            }
            update() {
                this.px = centerX + (this.x / this.z) * FOCAL_LENGTH;
                this.py = centerY + (this.y / this.z) * FOCAL_LENGTH;
                if (rearView) {
                    this.z += speed;
                    if (this.z >= MAX_DEPTH) this.reset(false);
                } else {
                    this.z -= speed;
                    if (this.z <= 0) this.reset(false);
                }
            }
            draw() {
                const sx = centerX + (this.x / this.z) * FOCAL_LENGTH;
                const sy = centerY + (this.y / this.z) * FOCAL_LENGTH;
                if (sx < 0 || sx > width || sy < 0 || sy > height) return;
                const closeness = 1 - (this.z / MAX_DEPTH);
                const alpha = Math.min(1, closeness * 1.5);
                const strokeWidth = Math.max(0.5, closeness * 3);

                ctx.lineCap = 'round';

                // Base trail - always rendered exactly as before.
                ctx.beginPath();
                ctx.moveTo(this.px, this.py);
                ctx.lineTo(sx, sy);
                ctx.strokeStyle = `rgba(220, 240, 255, ${alpha})`;
                ctx.lineWidth = strokeWidth;
                ctx.stroke();

                if (aberration <= 0) return;

                // Lens-style fringing: red frays outward, blue inward.
                // Offset grows with distance from the vanishing point,
                // so the center stays clean and the edges smear.
                const dx = sx - centerX;
                const dy = sy - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                const shift = aberration * Math.min(18, dist / 55) * (0.35 + 0.65 * closeness);
                const ux = dx / dist;
                const uy = dy / dist;
                const fringeAlpha = alpha * 0.5;

                ctx.lineWidth = Math.max(0.5, strokeWidth * 0.85);

                ctx.beginPath();
                ctx.moveTo(this.px + ux * shift, this.py + uy * shift);
                ctx.lineTo(sx + ux * shift, sy + uy * shift);
                ctx.strokeStyle = `rgba(255, 96, 96, ${fringeAlpha})`;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(this.px - ux * shift, this.py - uy * shift);
                ctx.lineTo(sx - ux * shift, sy - uy * shift);
                ctx.strokeStyle = `rgba(96, 140, 255, ${fringeAlpha})`;
                ctx.stroke();
            }
        }

        let stars = [];
        function setStarCount(n) {
            STAR_COUNT = n;
            while (stars.length > STAR_COUNT) stars.pop();
            while (stars.length < STAR_COUNT) stars.push(new Star());
            document.getElementById('countDisplay').textContent = STAR_COUNT;
        }

        function animate() {
            ctx.fillStyle = showTrails ? 'rgba(0, 0, 0, 0.25)' : '#000000';
            ctx.fillRect(0, 0, width, height);
            for (let star of stars) {
                star.update();
                star.draw();
            }
            requestAnimationFrame(animate);
        }

        // --- Settings: single state object, persisted as warp.settings.v2 ---
        //
        // The panel is a view over `state`: every control writes into it,
        // and renderControls() pushes it back to the DOM. The sound layers
        // are described by the bank (sounds/bank.js), so new sounds need no
        // panel, persistence, or reset plumbing here.

        const SETTINGS_KEY = 'warp.settings.v2';
        const SETTINGS_KEY_V1 = 'warp.settings.v1';

        const clampNum = (v, min, max) =>
            (typeof v === 'number' && Number.isFinite(v)) ? Math.min(max, Math.max(min, v)) : null;

        function defaultState() {
            return {
                v: 2,
                starfield: { speed: 15, count: 800, trails: false, rearView: false, aberration: 0, edgeGlow: 0 },
                sound: { enabled: false, master: 0.3, phaseDup: 0, width: 0.8, reverb: 1.0, chorus: 0.8 },
                warp: 'warp-4',
                layers: Object.fromEntries(SOUND_BANK.map((def) => [def.id, {
                    enabled: def.enabledByDefault === true,
                    ...Object.fromEntries(def.params.map((p) => [p.key, p.def])),
                }])),
                egg: { borg: false },
            };
        }

        function sanitize(s) {
            const sf = s.starfield;
            const so = s.sound;
            const cSpeed = clampNum(sf.speed, 1, 20); if (cSpeed !== null) sf.speed = cSpeed;
            const cCount = clampNum(sf.count, 100, 2000); if (cCount !== null) sf.count = cCount;
            const cAberr = clampNum(sf.aberration, 0, 1); if (cAberr !== null) sf.aberration = cAberr;
            const cGlow = clampNum(sf.edgeGlow, 0, 1); if (cGlow !== null) sf.edgeGlow = cGlow;
            const cMaster = clampNum(so.master, 0, 1); if (cMaster !== null) so.master = cMaster;
            const cDup = clampNum(so.phaseDup, 0, 4); if (cDup !== null) so.phaseDup = Math.round(cDup);
            const cWidth = clampNum(so.width, 0, 1); if (cWidth !== null) so.width = cWidth;
            const cRev = clampNum(so.reverb, 0, 1); if (cRev !== null) so.reverb = cRev;
            const cChor = clampNum(so.chorus, 0, 1); if (cChor !== null) so.chorus = cChor;
        }

        function presetMatches(preset, s) {
            for (const [layerId, values] of Object.entries(preset.values)) {
                const layer = s.layers[layerId];
                if (!layer) return false;
                for (const [key, value] of Object.entries(values)) {
                    if (Math.abs(layer[key] - value) > 1e-9) return false;
                }
            }
            return true;
        }

        // v1 stored one flat object of element ids (speedRange, hiFreqToggle,
        // ...). Map the survivors into the v2 shape.
        const V1_MAP = [
            ['speedRange', (s, val) => { s.starfield.speed = parseInt(val, 10); }],
            ['countRange', (s, val) => { s.starfield.count = parseInt(val, 10); }],
            ['trailsToggle', (s, val) => { s.starfield.trails = !!val; }],
            ['rearViewToggle', (s, val) => { s.starfield.rearView = !!val; }],
            ['aberrationRange', (s, val) => { s.starfield.aberration = parseFloat(val); }],
            ['edgeGlowRange', (s, val) => { s.starfield.edgeGlow = parseFloat(val); }],
            ['soundToggle', (s, val) => { s.sound.enabled = !!val; }],
            ['phaseDupRange', (s, val) => { s.sound.phaseDup = parseInt(val, 10); }],
            ['stereoWidthRange', (s, val) => { s.sound.width = parseFloat(val); }],
            ['reverbMixRange', (s, val) => { s.sound.reverb = parseFloat(val); }],
            ['chorusMixRange', (s, val) => { s.sound.chorus = parseFloat(val); }],
            ['hiVolRange', (s, val) => { s.layers.cooling.volume = parseFloat(val); }],
            ['hiPitchRange', (s, val) => { s.layers.cooling.pitch = parseFloat(val); }],
            ['hiSpeedRange', (s, val) => { s.layers.cooling.speed = parseFloat(val); }],
            ['hiFreqToggle', (s, val) => { s.layers.cooling.enabled = !!val; }],
        ];

        function migrateV1(s, v1) {
            for (const [key, apply] of V1_MAP) {
                if (!(key in v1)) continue;
                const num = parseFloat(v1[key]);
                if (typeof v1[key] !== 'boolean' && Number.isNaN(num)) continue;
                apply(s, v1[key]);
            }
            s.warp = WARP_PRESETS.some((p) => presetMatches(p, s)) ? 'warp-4' : 'custom';
        }

        function mergeV2(s, raw) {
            Object.assign(s.starfield, raw.starfield || {});
            Object.assign(s.sound, raw.sound || {});
            if (typeof raw.warp === 'string') s.warp = raw.warp;
            const rawLayers = raw.layers || {};
            for (const def of SOUND_BANK) {
                const saved = rawLayers[def.id] || {};
                const layer = s.layers[def.id];
                if (typeof saved.enabled === 'boolean') layer.enabled = saved.enabled;
                for (const p of def.params) {
                    const c = clampNum(saved[p.key], p.min, p.max);
                    if (c !== null) layer[p.key] = c;
                }
            }
            if (raw.egg && typeof raw.egg.borg === 'boolean') s.egg.borg = raw.egg.borg;
        }

        function loadSettings() {
            const s = defaultState();
            let v2 = null;
            try { v2 = JSON.parse(localStorage.getItem(SETTINGS_KEY)); } catch (e) {}
            if (v2 && typeof v2 === 'object' && v2.v === 2) {
                mergeV2(s, v2);
                sanitize(s);
                return s;
            }
            let v1 = null;
            try { v1 = JSON.parse(localStorage.getItem(SETTINGS_KEY_V1)); } catch (e) {}
            if (v1 && typeof v1 === 'object') migrateV1(s, v1);
            sanitize(s);
            return s;
        }

        const state = loadSettings();

        const saveSettings = () => {
            try {
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(state));
            } catch (e) { /* storage unavailable (private mode etc.) */ }
        };

        // --- Audio Architecture ---
        let audioCtx = null;
        let engine = null; // WarpEngine (sounds/engine.js)

        // --- iOS Audio: kickstart + interruption recovery ---
        //
        // iOS Safari keeps the Web Audio render thread at low priority until
        // a native HTML5 media element claims the output hardware, and it
        // yanks the AudioContext whenever system audio takes over (call,
        // Siri, Control Center, app switch). The helpers below keep the
        // graph running through both.

        const isIOS = () =>
            /iphone|ipad|ipod/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        // A fraction of a second of pure silence. Playing it through a
        // native <audio> element forces the iOS media engine into its
        // high-performance state, which removes the Web Audio crackle.
        const SILENT_KICKSTART =
            'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==';
        let kickstartAudio = null;

        function kickstartIOSAudio() {
            if (!kickstartAudio) kickstartAudio = new Audio(SILENT_KICKSTART);
            kickstartAudio.currentTime = 0;
            return kickstartAudio.play().catch((err) => {
                console.log('Audio kickstart failed:', err);
            });
        }

        // Bring the context back to running. On iOS the silent kickstart
        // runs first so the hardware is warm when the graph resumes. Safe
        // to call outside a user gesture: where the browser refuses (iOS
        // after an interruption) the one-shot armer below picks it up on
        // the next touch.
        async function ensureAudioRunning() {
            if (!audioCtx || audioCtx.state === 'running') return;
            if (isIOS()) await kickstartIOSAudio();
            try { await audioCtx.resume(); } catch (err) { /* next gesture */ }
        }

        // iOS only resumes a suspended/interrupted context inside a user
        // gesture, so arm one-shot listeners whenever it drops out from
        // under us while the user still has sound switched on.
        const RESUME_EVENTS = ['pointerdown', 'touchend', 'click', 'keydown'];
        let resumeArmed = false;

        function armOneShotResume() {
            if (resumeArmed || !audioCtx || audioCtx.state === 'running') return;
            if (!state.sound.enabled) return;
            resumeArmed = true;
            const handler = () => {
                resumeArmed = false;
                RESUME_EVENTS.forEach((ev) => window.removeEventListener(ev, handler));
                if (!state.sound.enabled) return; // muted in the meantime
                ensureAudioRunning();
            };
            RESUME_EVENTS.forEach((ev) => window.addEventListener(ev, handler));
        }

        // Single entry point for "sound should be on now" (gesture handlers).
        function startSynthesizer() {
            if (!audioCtx) {
                initSynthesizer();
            } else if (audioCtx.state !== 'running') {
                ensureAudioRunning();
            }
        }

        function initSynthesizer() {
            // iOS Safari follows the hardware sample rate, which can flip
            // between 44.1 and 48 kHz mid-session (incoming call,
            // Bluetooth, screen state). Pinning the context to one rate
            // avoids the internal resampling that produces the crackle;
            // fall back to the device default if the browser rejects it.
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            try {
                audioCtx = new AudioContextClass({ sampleRate: 44100 });
            } catch (err) {
                audioCtx = new AudioContextClass();
            }

            // Some mobile browsers (notably iOS Safari) create the context
            // suspended even inside a user gesture - start it right away.
            ensureAudioRunning();

            // iOS yanks the context when system audio takes over (call,
            // Siri, Control Center, app switch). A delayed blind resume
            // sometimes succeeds; the gesture-gated one always does, so do
            // both whenever the user still has sound on.
            audioCtx.onstatechange = () => {
                if (audioCtx.state !== 'interrupted' && audioCtx.state !== 'suspended') return;
                armOneShotResume();
                setTimeout(() => {
                    if (audioCtx.state === 'interrupted' || audioCtx.state === 'suspended') {
                        ensureAudioRunning();
                    }
                }, 1000);
            };

            // The engine builds the whole graph (effects chain + every bank
            // layer) from the current state snapshot.
            engine = new WarpEngine(audioCtx, {
                master: state.sound.master,
                fx: { width: state.sound.width, reverb: state.sound.reverb, chorus: state.sound.chorus },
                layers: state.layers,
            });
            engine.setInstanceCount(1 + state.sound.phaseDup);
        }

        // Push the current sound state into the live graph (no-op before the
        // first gesture, when the engine does not exist yet).
        function applySoundToEngine() {
            if (!engine) return;
            engine.setMasterVolume(state.sound.master);
            engine.setInstanceCount(1 + state.sound.phaseDup);
            engine.setFx('width', state.sound.width);
            engine.setFx('reverb', state.sound.reverb);
            engine.setFx('chorus', state.sound.chorus);
            for (const def of SOUND_BANK) {
                const st = state.layers[def.id];
                engine.setLayerEnabled(def.id, st.enabled);
                for (const p of def.params) engine.setLayerValue(def.id, p.key, st[p.key] ?? p.def);
            }
        }

        // --- Control panel: static controls ---
        const edgeGlowEl = document.getElementById('edgeGlow');

        const setVal = (id, v) => { document.getElementById(id).value = v; };
        const setDisplay = (id, t) => { document.getElementById(id).textContent = t; };
        const setToggle = (id, on) => {
            const el = document.getElementById(id);
            el.classList.toggle('active', on);
            el.setAttribute('aria-checked', String(on));
        };

        document.getElementById('speedRange').addEventListener('input', (e) => {
            speed = state.starfield.speed = parseInt(e.target.value, 10);
            setDisplay('speedDisplay', speed + 'x');
            saveSettings();
        });

        document.getElementById('countRange').addEventListener('input', (e) => {
            state.starfield.count = parseInt(e.target.value, 10);
            setStarCount(state.starfield.count);
            saveSettings();
        });

        document.getElementById('trailsToggle').addEventListener('click', function() {
            showTrails = state.starfield.trails = !state.starfield.trails;
            this.classList.toggle('active', showTrails);
            this.setAttribute('aria-checked', String(showTrails));
            saveSettings();
        });

        // Rear view: the camera faces away from the direction of travel, so
        // stars enter from the edge of the screen and streak inward toward
        // the vanishing point. Flipping the view re-seeds the starfield.
        function setViewMode(rear) {
            if (rearView === rear) return;
            rearView = rear;
            stars.forEach((s) => s.reset(true));
        }

        document.getElementById('rearViewToggle').addEventListener('click', function() {
            state.starfield.rearView = !state.starfield.rearView;
            setViewMode(state.starfield.rearView);
            this.classList.toggle('active', state.starfield.rearView);
            this.setAttribute('aria-checked', String(state.starfield.rearView));
            saveSettings();
        });

        document.getElementById('aberrationRange').addEventListener('input', (e) => {
            aberration = state.starfield.aberration = parseFloat(e.target.value);
            setDisplay('aberrationDisplay', Math.round(aberration * 100) + '%');
            saveSettings();
        });

        document.getElementById('edgeGlowRange').addEventListener('input', (e) => {
            const val = state.starfield.edgeGlow = parseFloat(e.target.value);
            edgeGlowEl.style.opacity = val;
            setDisplay('edgeGlowDisplay', Math.round(val * 100) + '%');
            saveSettings();
        });

        document.getElementById('soundToggle').addEventListener('click', function() {
            // Flip the switch synchronously so the persisted state matches
            // what the user sees before any async audio work runs.
            const turningOn = !this.classList.contains('active');
            this.classList.toggle('active', turningOn);
            this.setAttribute('aria-checked', String(turningOn));
            state.sound.enabled = turningOn;
            if (turningOn) {
                startSynthesizer();
            } else if (audioCtx && audioCtx.state === 'running') {
                audioCtx.suspend();
            }
            saveSettings();
        });

        document.getElementById('masterRange').addEventListener('input', (e) => {
            const val = state.sound.master = parseFloat(e.target.value);
            setDisplay('masterDisplay', Math.round(val * 100) + '%');
            if (engine) engine.setMasterVolume(val);
            saveSettings();
        });

        document.getElementById('phaseDupRange').addEventListener('input', (e) => {
            const count = state.sound.phaseDup = parseInt(e.target.value, 10);
            setDisplay('phaseDupDisplay', count);
            if (engine) engine.setInstanceCount(1 + count);
            saveSettings();
        });

        document.getElementById('stereoWidthRange').addEventListener('input', (e) => {
            const val = state.sound.width = parseFloat(e.target.value);
            setDisplay('widthDisplay', Math.round(val * 100) + '%');
            if (engine) engine.setFx('width', val);
            saveSettings();
        });

        document.getElementById('reverbMixRange').addEventListener('input', (e) => {
            const val = state.sound.reverb = parseFloat(e.target.value);
            setDisplay('reverbDisplay', Math.round(val * 100) + '%');
            if (engine) engine.setFx('reverb', val);
            saveSettings();
        });

        document.getElementById('chorusMixRange').addEventListener('input', (e) => {
            const val = state.sound.chorus = parseFloat(e.target.value);
            setDisplay('chorusDisplay', Math.round(val * 100) + '%');
            if (engine) engine.setFx('chorus', val);
            saveSettings();
        });

        // --- Warp factor presets (chip row) ---
        const warpRow = document.getElementById('warpChips');
        for (const preset of WARP_PRESETS) {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'chip';
            chip.id = 'warpChip-' + preset.id;
            chip.textContent = preset.label;
            chip.title = preset.hint;
            chip.setAttribute('aria-pressed', 'false');
            chip.addEventListener('click', () => applyWarp(preset.id));
            warpRow.appendChild(chip);
        }

        function syncWarpChips() {
            for (const preset of WARP_PRESETS) {
                const on = state.warp === preset.id;
                const chip = document.getElementById('warpChip-' + preset.id);
                chip.classList.toggle('active', on);
                chip.setAttribute('aria-pressed', String(on));
            }
        }

        function applyWarp(presetId) {
            const preset = WARP_PRESETS.find((p) => p.id === presetId);
            if (!preset) return;
            for (const [layerId, values] of Object.entries(preset.values)) {
                const layer = state.layers[layerId];
                if (!layer) continue;
                for (const [key, value] of Object.entries(values)) {
                    if (key in layer) layer[key] = value;
                }
            }
            state.warp = presetId;
            syncWarpChips();
            renderLayerRows();
            applySoundToEngine();
            saveSettings();
        }

        // --- Sound layers (auto-generated from the sound bank) ---
        const layerRowsEl = document.getElementById('layerRows');

        function buildLayerRows() {
            layerRowsEl.innerHTML = '';
            for (const def of SOUND_BANK) {
                // Egg-locked layers stay out of the panel until unlocked.
                if (def.egg && !state.egg[def.egg]) continue;
                const st = state.layers[def.id];

                const row = document.createElement('div');
                row.className = 'layer-row';
                row.dataset.layer = def.id;

                const head = document.createElement('div');
                head.className = 'layer-head';

                const toggle = document.createElement('div');
                toggle.className = 'toggle';
                toggle.id = 'layerToggle-' + def.id;
                toggle.setAttribute('role', 'switch');
                toggle.setAttribute('tabindex', '0');
                toggle.setAttribute('aria-label', def.label);

                const label = document.createElement('span');
                label.className = 'layer-label';
                label.textContent = def.label;

                const chev = document.createElement('button');
                chev.type = 'button';
                chev.className = 'layer-chev';
                chev.setAttribute('aria-expanded', 'false');
                chev.setAttribute('aria-label', 'Tune ' + def.label);
                chev.textContent = '▾';

                head.append(toggle, label, chev);

                const body = document.createElement('div');
                body.className = 'layer-body';
                body.hidden = true;

                const flavor = document.createElement('p');
                flavor.className = 'layer-flavor';
                flavor.textContent = def.flavor;
                body.appendChild(flavor);

                for (const p of def.params) {
                    const group = document.createElement('div');
                    group.className = 'setting-group';
                    const rangeId = `layerRange-${def.id}-${p.key}`;

                    const lab = document.createElement('label');
                    lab.setAttribute('for', rangeId);
                    lab.textContent = p.label;

                    const input = document.createElement('input');
                    input.type = 'range';
                    input.id = rangeId;
                    input.min = p.min;
                    input.max = p.max;
                    input.step = p.step;

                    const disp = document.createElement('span');
                    disp.className = 'display-val';
                    disp.id = `layerDisplay-${def.id}-${p.key}`;

                    input.addEventListener('input', (e) => {
                        const v = parseFloat(e.target.value);
                        st[p.key] = v;
                        disp.textContent = p.format ? p.format(v) : String(v);
                        // A manual tweak takes the sound off the preset.
                        state.warp = 'custom';
                        syncWarpChips();
                        if (engine) engine.setLayerValue(def.id, p.key, v);
                        saveSettings();
                    });

                    group.append(lab, input, disp);
                    body.appendChild(group);
                }

                toggle.addEventListener('click', () => {
                    st.enabled = !st.enabled;
                    toggle.classList.toggle('active', st.enabled);
                    toggle.setAttribute('aria-checked', String(st.enabled));
                    if (engine) engine.setLayerEnabled(def.id, st.enabled);
                    saveSettings();
                });

                // Accordion: opening a sub-menu closes the others.
                chev.addEventListener('click', () => {
                    const willOpen = body.hidden;
                    layerRowsEl.querySelectorAll('.layer-body').forEach((b) => { b.hidden = true; });
                    layerRowsEl.querySelectorAll('.layer-chev').forEach((c) => c.setAttribute('aria-expanded', 'false'));
                    body.hidden = !willOpen;
                    chev.setAttribute('aria-expanded', String(willOpen));
                });

                row.append(head, body);
                layerRowsEl.appendChild(row);
            }
            renderLayerRows();
        }

        function renderLayerRows() {
            for (const def of SOUND_BANK) {
                const row = layerRowsEl.querySelector(`.layer-row[data-layer="${def.id}"]`);
                if (!row) continue;
                const st = state.layers[def.id];
                setToggle('layerToggle-' + def.id, st.enabled);
                for (const p of def.params) {
                    const value = st[p.key] ?? p.def;
                    setVal(`layerRange-${def.id}-${p.key}`, value);
                    setDisplay(`layerDisplay-${def.id}-${p.key}`, p.format ? p.format(value) : String(value));
                }
            }
        }

        // --- Push state to every control (after load / reset) ---
        function renderControls() {
            const sf = state.starfield;
            setVal('speedRange', sf.speed);
            setDisplay('speedDisplay', sf.speed + 'x');
            setVal('countRange', sf.count);
            setDisplay('countDisplay', sf.count);
            setToggle('trailsToggle', sf.trails);
            setToggle('rearViewToggle', sf.rearView);
            setVal('aberrationRange', sf.aberration);
            setDisplay('aberrationDisplay', Math.round(sf.aberration * 100) + '%');
            setVal('edgeGlowRange', sf.edgeGlow);
            setDisplay('edgeGlowDisplay', Math.round(sf.edgeGlow * 100) + '%');

            const so = state.sound;
            setToggle('soundToggle', so.enabled);
            setVal('masterRange', so.master);
            setDisplay('masterDisplay', Math.round(so.master * 100) + '%');
            setVal('phaseDupRange', so.phaseDup);
            setDisplay('phaseDupDisplay', so.phaseDup);
            setVal('stereoWidthRange', so.width);
            setDisplay('widthDisplay', Math.round(so.width * 100) + '%');
            setVal('reverbMixRange', so.reverb);
            setDisplay('reverbDisplay', Math.round(so.reverb * 100) + '%');
            setVal('chorusMixRange', so.chorus);
            setDisplay('chorusDisplay', Math.round(so.chorus * 100) + '%');

            syncWarpChips();
            renderLayerRows();
        }

        function applyStarfieldToRuntime() {
            const sf = state.starfield;
            speed = sf.speed;
            setStarCount(sf.count);
            showTrails = sf.trails;
            setViewMode(sf.rearView);
            aberration = sf.aberration;
            edgeGlowEl.style.opacity = sf.edgeGlow;
        }

        // --- Reset ---
        function resetSettings() {
            try {
                localStorage.removeItem(SETTINGS_KEY);
                localStorage.removeItem(SETTINGS_KEY_V1);
            } catch (e) {}
            const fresh = defaultState();
            Object.assign(state.starfield, fresh.starfield);
            Object.assign(state.sound, fresh.sound);
            state.warp = fresh.warp;
            for (const def of SOUND_BANK) {
                // Mutate in place: the engine holds a reference to these objects.
                Object.assign(state.layers[def.id], fresh.layers[def.id]);
            }
            Object.assign(state.egg, fresh.egg);

            document.body.classList.remove('borg');
            buildLayerRows();
            renderControls();
            applyStarfieldToRuntime();
            if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
            if (engine) applySoundToEngine();
        }

        // --- The Collective: hidden easter egg ---
        // Tap the version tag five times within three seconds. Flips the
        // whole UI accent from blue to green (CSS vars on body.borg) and
        // reveals the Collective layer in the sound bank.
        const versionTag = document.getElementById('versionTag');
        let borgTapCount = 0;
        let borgTapTimer = null;
        const BORG_TAPS = 5;

        versionTag.addEventListener('click', (e) => {
            e.stopPropagation();
            borgTapCount += 1;
            clearTimeout(borgTapTimer);
            borgTapTimer = setTimeout(() => { borgTapCount = 0; }, 3000);
            if (borgTapCount >= BORG_TAPS) {
                borgTapCount = 0;
                toggleBorg();
            }
        });

        function toggleBorg() {
            state.egg.borg = !state.egg.borg;
            document.body.classList.toggle('borg', state.egg.borg);
            buildLayerRows(); // rebuild so the egg-locked row appears/vanishes
            renderControls();
            if (engine) engine.setLayerEnabled('borg', !!state.layers.borg.enabled);
            saveSettings();
        }

        // --- Counselor's Corner: one quote a day from data/quotes.txt ---
        // Format: one quote per block - a line of text, then a line starting
        // with "—" for the attribution, blocks separated by blank lines.
        const counselorCorner = document.getElementById('counselorCorner');
        let loadedQuotes = [];

        function parseQuotes(text) {
            const entries = [];
            for (const block of text.split(/\n\s*\n/)) {
                const lines = block.split('\n').map((l) => l.trim()).filter(Boolean);
                if (!lines.length || !lines[0]) continue;
                const attr = lines.length > 1 && lines[1].startsWith('—') ? lines[1].slice(1).trim() : '';
                entries.push({ quote: lines[0], attr });
            }
            return entries;
        }

        async function loadCounselorQuote() {
            try {
                const res = await fetch('data/quotes.txt');
                if (!res.ok) return;
                loadedQuotes = parseQuotes(await res.text());
                if (!loadedQuotes.length) return;
                const startOfYear = new Date(new Date().getFullYear(), 0, 1);
                const day = Math.floor((Date.now() - startOfYear.getTime()) / 86400000);
                const q = loadedQuotes[day % loadedQuotes.length];
                document.getElementById('counselorQuote').textContent = '“' + q.quote + '”';
                document.getElementById('counselorAttr').textContent = q.attr ? '— ' + q.attr : '';
                counselorCorner.hidden = false;
            } catch (e) { /* no quotes file yet (offline before first cache): stay hidden */ }
        }

        // --- Boot ---
        document.body.classList.toggle('borg', state.egg.borg);
        buildLayerRows();
        renderControls();
        applyStarfieldToRuntime();
        document.getElementById('resetBtn').addEventListener('click', resetSettings);
        versionTag.textContent = 'v' + APP_VERSION;
        loadCounselorQuote();
        animate();

        // Audio cannot start before the user's first gesture - if sound
        // was on, start it then (the state already holds the saved params).
        // touchend/click are included because some mobile browsers only
        // unlock audio on the tap-up, not the tap-down.
        if (state.sound.enabled) {
            const START_EVENTS = ['pointerdown', 'touchend', 'click', 'keydown'];
            const startAudio = () => {
                startSynthesizer();
                START_EVENTS.forEach((ev) => window.removeEventListener(ev, startAudio));
            };
            START_EVENTS.forEach((ev) => window.addEventListener(ev, startAudio));
        }

        // Debug handle for the automated test suite (tests/): load with
        // ?debug=1 to expose simulation internals on window.__warp.
        if (new URLSearchParams(location.search).has('debug')) {
            window.__warp = {
                get stars() { return stars; },
                get rearView() { return rearView; },
                get state() { return state; },
                get engine() { return engine; },
                get bank() { return SOUND_BANK; },
                get quotes() { return loadedQuotes; },
                applyWarp,
                toggleBorg,
            };
        }

        // --- Control panel: opened from the tiny icon in the top-right,
        //     auto-hides again once idle ---
        const settingsPanel = document.querySelector('.settings');
        const panelToggle = document.getElementById('panelToggle');
        const SETTINGS_IDLE_MS = 8000;
        const PEAK_OPACITY = 0.4;  // how visible the icon gets on pointer activity
        const PEAK_HOLD_MS = 2000; // how long the peek holds after the last move
        let settingsHideTimer = null;
        let peakTimer = null;

        settingsPanel.inert = true; // hidden panel stays out of the tab order

        const openPanel = () => {
            settingsPanel.classList.add('open');
            settingsPanel.inert = false;
            document.body.classList.add('panel-open');
            panelToggle.setAttribute('aria-expanded', 'true');
            panelToggle.style.opacity = ''; // the panel-open CSS state takes over
            clearTimeout(settingsHideTimer);
            settingsHideTimer = setTimeout(closePanel, SETTINGS_IDLE_MS);
        };

        const closePanel = () => {
            clearTimeout(settingsHideTimer);
            clearTimeout(peakTimer);
            settingsPanel.classList.remove('open');
            settingsPanel.inert = true;
            document.body.classList.remove('panel-open');
            panelToggle.setAttribute('aria-expanded', 'false');
            panelToggle.style.opacity = '';
        };

        // Progressive reveal: the faint mixer icon "peeks" a little brighter
        // while the pointer moves over the scene, then fades back to rest.
        const peekToggle = () => {
            if (document.body.classList.contains('panel-open')) return;
            panelToggle.style.opacity = PEAK_OPACITY;
            clearTimeout(peakTimer);
            peakTimer = setTimeout(() => { panelToggle.style.opacity = ''; }, PEAK_HOLD_MS);
        };

        panelToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            if (settingsPanel.classList.contains('open')) closePanel();
            else openPanel();
        });

        settingsPanel.addEventListener('click', openPanel); // resets the idle timer
        settingsPanel.addEventListener('input', saveSettings); // safety net
        settingsPanel.addEventListener('pointermove', openPanel);
        settingsPanel.addEventListener('focusin', openPanel);

        // Keyboard support for the visual switches (Space / Enter), static
        // and bank-generated alike.
        settingsPanel.addEventListener('keydown', (e) => {
            if ((e.key === ' ' || e.key === 'Enter') && e.target.classList && e.target.classList.contains('toggle')) {
                e.preventDefault();
                e.target.click();
            }
        });

        canvas.addEventListener('pointermove', peekToggle);
        canvas.addEventListener('pointerdown', peekToggle);

        document.addEventListener('click', (e) => {
            if (!settingsPanel.contains(e.target)) closePanel();
        });

        // --- PWA: Install CTA (first launch, dismissible) ---
        const installCta = document.getElementById('installCta');
        const installCtaCard = document.getElementById('installCtaCard');
        const installCtaTitle = document.getElementById('installCtaTitle');
        const installCtaSub = document.getElementById('installCtaSub');
        const installCtaInstallBtn = document.getElementById('installCtaInstall');
        const installCtaDismissBtn = document.getElementById('installCtaDismiss');
        const CTA_DISMISSED_KEY = 'warp.installCta.dismissed.v1';

        let deferredPrompt = null;

        const isStandalone = () =>
            window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: window-controls-overlay)').matches ||
            window.navigator.standalone === true;

        const wasDismissed = () => {
            try { return localStorage.getItem(CTA_DISMISSED_KEY) === '1'; } catch (e) { return true; }
        };

        const markDismissed = () => {
            try { localStorage.setItem(CTA_DISMISSED_KEY, '1'); } catch (e) { /* private mode */ }
        };

        installCta.inert = true; // hidden CTA stays out of the tab order

        const hideCta = () => {
            installCta.classList.remove('visible');
            installCta.inert = true;
        };

        const showCta = () => {
            if (isStandalone() || wasDismissed()) return;
            installCta.classList.add('visible');
            installCta.inert = false;
        };

        /* Chrome/Edge/Firefox hand us the real install prompt. */
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(showCta, 900);
        });

        /* iOS Safari has no beforeinstallprompt: show a how-to hint instead. */
        if (isIOS() && !isStandalone()) {
            installCtaTitle.textContent = 'Add Warp to your home screen';
            installCtaSub.textContent = 'Tap Share, then “Add to Home Screen”';
            installCtaInstallBtn.style.display = 'none';
            setTimeout(showCta, 900);
        }

        window.addEventListener('appinstalled', () => {
            markDismissed();
            deferredPrompt = null;
            hideCta();
        });

        installCtaInstallBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (!deferredPrompt || typeof deferredPrompt.prompt !== 'function') return;
            try {
                deferredPrompt.prompt();
                const choice = await deferredPrompt.userChoice;
                deferredPrompt = null;
                if (choice.outcome === 'accepted') {
                    markDismissed();
                    hideCta();
                }
            } catch (err) {
                console.warn('Install prompt failed:', err);
            }
        });

        installCtaDismissBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            markDismissed();
            hideCta();
        });

        /* Tapping anywhere else on the card dismisses it too. */
        installCtaCard.addEventListener('click', () => {
            markDismissed();
            hideCta();
        });

        // --- PWA: Service Worker registration (offline support) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.warn('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
