<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="keywords" content="Star Trek ambient noise, Enterprise D engine hum, Engineering background sound, Warp core white noise, Star Trek sleep sound, Web Audio synthesizer">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Blue edge glow (slider-controlled) — same hues as the install CTA's glow. */
        .edge-glow {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            box-shadow:
                inset 0 0 60px 12px rgba(130, 180, 255, 0.55),
                inset 0 0 190px 55px rgba(70, 130, 255, 0.7);
        }

        .settings {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(14, 20, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 0.8rem 1.25rem;
            z-index: 10;
            backdrop-filter: blur(12px);
            display: flex;
            gap: 0.5rem 0.35rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 92vw;
            transition: opacity 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        /* Open state — toggled from the tiny icon in the top-right.
           Same blue glow as the install CTA. */
        .settings.open {
            opacity: 1;
            pointer-events: auto;
            border-color: rgba(130, 180, 255, 0.35);
            box-shadow: 0 10px 34px rgba(70, 130, 255, 0.28);
        }

        .settings-section {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.1rem;
        }

        .settings-divider {
            width: 1px;
            align-self: stretch;
            margin: 0.25rem 0.15rem;
            background: rgba(130, 180, 255, 0.25);
        }

        /* Tiny toggle icon in the top-right corner — the only always-visible
           hint that controls exist (same faint opacity as the old hidden panel). */
        .panel-toggle {
            position: fixed;
            top: 0.75rem;
            right: 0.75rem;
            z-index: 20;
            width: 2.25rem;
            height: 2.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(14, 20, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            opacity: 0.05;
            transition: opacity 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* While the panel is open the icon is fully visible and doubles
           as the close control. */
        body.panel-open .panel-toggle {
            opacity: 1;
            border-color: rgba(130, 180, 255, 0.35);
            box-shadow: 0 10px 34px rgba(70, 130, 255, 0.28);
        }

        .toggle:focus-visible,
        .reset-btn:focus-visible,
        .panel-toggle:focus-visible {
            outline: 2px solid rgba(130, 180, 255, 0.7);
            outline-offset: 2px;
        }

        /* Mobile: a centered, scrollable sheet — big enough to reach,
           compact enough to leave the starfield visible around it. */
        @media (max-width: 700px) {
            .settings {
                width: calc(100vw - 2rem);
                max-width: 420px;
                max-height: 72vh;
                overflow-y: auto;
                padding: 1.1rem 1.25rem 1.25rem;
                border-radius: 16px;
                flex-direction: column;
                flex-wrap: nowrap;
                align-items: stretch;
                justify-content: flex-start;
                gap: 0.9rem;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: thin;
                scrollbar-color: rgba(130, 180, 255, 0.3) transparent;
            }

            .settings::-webkit-scrollbar {
                width: 4px;
            }

            .settings::-webkit-scrollbar-thumb {
                background: rgba(130, 180, 255, 0.3);
                border-radius: 2px;
            }

            .settings-section {
                flex-direction: column;
                align-items: stretch;
                gap: 0.85rem;
            }

            .settings-divider {
                width: auto;
                height: 1px;
                margin: 0.1rem 0;
            }

            .setting-group {
                font-size: 0.85rem;
            }

            .setting-group label {
                flex: 0 0 5.5rem;
            }

            .setting-group input[type="range"] {
                flex: 1;
                width: auto;
                min-width: 0;
            }

            .display-val {
                min-width: 3rem;
                text-align: right;
            }

            .toggle-row {
                justify-content: space-between;
            }

            .settings-meta {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        .setting-group label {
            color: rgba(255, 255, 255, 0.7);
        }

        .reset-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            padding: 0.35rem 0.65rem;
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.2s, border-color 0.2s;

        .reset-btn:hover {
            color: #fff;
            border-color: rgba(130, 180, 255, 0.5);

        .version-tag {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            white-space: nowrap;
        }

        input[type="range"] {
            width: 85px;
            accent-color: #fff;
        }

        .display-val {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            min-width: 40px;
        }

        .toggle {
            width: 40px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            transition: left 0.3s;
        }

        .toggle.active {
            background: rgba(255, 255, 255, 0.6);
        }

        .toggle.active::after {
            left: 22px;
        }

        /* --- Install CTA (first launch, dismissible) --- */
        .install-cta {
            position: fixed;
            left: 50%;
            bottom: 1rem;
            transform: translateX(-50%) translateY(150%);
            z-index: 100;
            max-width: 92vw;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.45s ease;
        }

        .install-cta.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;

        .install-cta-card {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            background: rgba(14, 20, 30, 0.92);
            border: 1px solid rgba(130, 180, 255, 0.35);
            border-radius: 14px;
            padding: 0.65rem 0.65rem 0.65rem 1.1rem;
            box-shadow: 0 10px 34px rgba(70, 130, 255, 0.28);
            backdrop-filter: blur(12px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .install-cta-text {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            min-width: 0;
        }

        .install-cta-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .install-cta-sub {
            font-size: 0.78rem;
            color: rgba(200, 220, 255, 0.75);
            white-space: nowrap;
            overflow: hidden;

        .install-cta-btn {
            background: linear-gradient(135deg, #8ab8ff, #4a7dff);
            color: #05101f;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            border-radius: 999px;
            padding: 0.55rem 1.25rem;
            cursor: pointer;
            white-space: nowrap;
            transition: filter 0.2s;
        }

        .install-cta-btn:hover {
            filter: brightness(1.12);
        }

        .install-cta-dismiss {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
            line-height: 1;
            padding: 0.45rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .install-cta-dismiss:hover {
            color: #fff;
        }

        @media (max-width: 520px) {
            .install-cta-sub {
                display: none;
            }
        }
    </style>

<body>
    <canvas id="warpCanvas"></canvas>
    <div class="edge-glow" id="edgeGlow"></div>

            <circle cx="11.5" cy="5.5" r="2.4" fill="rgba(14, 20, 30, 0.92)" stroke="currentColor" stroke-width="1.5"/>

    <div class="settings">
        <!-- Starfield -->
        <div class="settings-section">

    <!-- PWA Install CTA (shown on first launch, tap anywhere on it to dismiss) -->

                <span class="install-cta-title" id="installCtaTitle">Install Warp</span>
                <span class="install-cta-sub" id="installCtaSub">Run offline, full-screen, from your home screen</span>
            </div>
            <button class="install-cta-btn" id="installCtaInstall">Install</button>
            <button class="install-cta-dismiss" id="installCtaDismiss" aria-label="Dismiss install prompt">✕</button>

    <script>
        // Release version — keep in sync with CHANGELOG.md
        const APP_VERSION = '0.1.0';

        const canvas = document.getElementById('warpCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, centerX, centerY;

        function resize() {
            // Render at device resolution so stars stay sharp on high-DPI
            // screens (capped at 2x to keep high star counts fast).
            const dpr = Math.min(2, window.devicePixelRatio || 1);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            centerX = width / 2;
            centerY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        let STAR_COUNT = 800;
        let MAX_DEPTH = 1500;
        const FOCAL_LENGTH = 400;
        let speed = 15;
        let showTrails = false;
        let aberration = 0;

        class Star {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = (Math.random() - 0.5) * width * 3;
                this.y = (Math.random() - 0.5) * height * 3;
                this.z = initial ? Math.random() * MAX_DEPTH : MAX_DEPTH;
                this.px = centerX + (this.x / this.z) * FOCAL_LENGTH;
                this.py = centerY + (this.y / this.z) * FOCAL_LENGTH;
            }
            update() {
                this.px = centerX + (this.x / this.z) * FOCAL_LENGTH;
                this.py = centerY + (this.y / this.z) * FOCAL_LENGTH;
                this.z -= speed;
                if (this.z <= 0) this.reset(false);
            }
            draw() {
                const sx = centerX + (this.x / this.z) * FOCAL_LENGTH;
                const sy = centerY + (this.y / this.z) * FOCAL_LENGTH;
                if (sx < 0 || sx > width || sy < 0 || sy > height) return;
                const closeness = 1 - (this.z / MAX_DEPTH);
                const alpha = Math.min(1, closeness * 1.5);
                const strokeWidth = Math.max(0.5, closeness * 3);

                ctx.lineCap = 'round';

                // Base trail — always rendered exactly as before.
                ctx.beginPath();
                ctx.moveTo(this.px, this.py);
                ctx.lineTo(sx, sy);
                ctx.strokeStyle = `rgba(220, 240, 255, ${alpha})`;
                ctx.lineWidth = strokeWidth;
                ctx.stroke();

                if (aberration <= 0) return;

                // Lens-style fringing: red frays outward, blue inward.
                // Offset grows with distance from the vanishing point,
                // so the center stays clean and the edges smear.
                const dx = sx - centerX;
                const dy = sy - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                const shift = aberration * Math.min(18, dist / 55) * (0.35 + 0.65 * closeness);
                const ux = dx / dist;
                const uy = dy / dist;
                const fringeAlpha = alpha * 0.5;

                ctx.lineWidth = Math.max(0.5, strokeWidth * 0.85);

                ctx.beginPath();
                ctx.moveTo(this.px + ux * shift, this.py + uy * shift);
                ctx.lineTo(sx + ux * shift, sy + uy * shift);
                ctx.strokeStyle = `rgba(255, 96, 96, ${fringeAlpha})`;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(this.px - ux * shift, this.py - uy * shift);
                ctx.lineTo(sx - ux * shift, sy - uy * shift);
                ctx.strokeStyle = `rgba(96, 140, 255, ${fringeAlpha})`;
                ctx.stroke();
            }
        }

        let stars = [];
        function updateStarCount() {
            const newCount = parseInt(document.getElementById('countRange').value);
            STAR_COUNT = newCount;
            while (stars.length > STAR_COUNT) stars.pop();
            while (stars.length < STAR_COUNT) stars.push(new Star());
            document.getElementById('countDisplay').textContent = STAR_COUNT;
        }

        function animate() {
            ctx.fillStyle = showTrails ? 'rgba(0, 0, 0, 0.25)' : '#000000';
            ctx.fillRect(0, 0, width, height);
            for (let star of stars) {
                star.update();
                star.draw();
            }
            requestAnimationFrame(animate);
        }

        document.getElementById('speedRange').addEventListener('input', (e) => {
            speed = parseInt(e.target.value);
            document.getElementById('speedDisplay').textContent = speed + 'x';
        });

        document.getElementById('countRange').addEventListener('input', updateStarCount);

        const trailsToggle = document.getElementById('trailsToggle');
        trailsToggle.addEventListener('click', function() {
            showTrails = !showTrails;
            this.classList.toggle('active');
            this.setAttribute('aria-checked', String(showTrails));
        });

        document.getElementById('aberrationRange').addEventListener('input', (e) => {
            aberration = parseFloat(e.target.value);
            document.getElementById('aberrationDisplay').textContent = Math.round(aberration * 100) + '%';
        });

        const edgeGlowEl = document.getElementById('edgeGlow');
        document.getElementById('edgeGlowRange').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            edgeGlowEl.style.opacity = val;
            document.getElementById('edgeGlowDisplay').textContent = Math.round(val * 100) + '%';
        });

        // --- Audio Architecture ---
        let audioCtx = null;
        let masterGain = null;

        // Active Engine Instances (Main + Phase Duplicates)
        let mainEngineInstance = null;
        let duplicateEngineInstances = [];

        // Single Hi-Layer (Shared/Global)
        let hiFreqEnabled = false;
        let hiFreqGain = null;
        let hiFreqBaseVol = 0.25;
        let hiDampingFilter = null;
        let hiResFilter1 = null, hiResFilter2 = null, hiResFilter3 = null;
        let hiOsc1 = null, hiOsc2 = null, hiLFO = null;

        function createReverbBuffer(ctx) {
            const duration = 1.2;
            const sampleRate = ctx.sampleRate;
            const length = sampleRate * duration;
            const impulse = ctx.createBuffer(2, length, sampleRate);
            const left = impulse.getChannelData(0);
            const right = impulse.getChannelData(1);

            for (let i = 0; i < length; i++) {
                const decay = Math.exp(-i / (sampleRate * 0.15));
                left[i] = (Math.random() * 2 - 1) * decay;
                right[i] = (Math.random() * 2 - 1) * decay;
            }
            return impulse;
        }

        // Creates a complete, standalone Tab Audio Instance (Synthesizer + Chorus + Reverb + Spatializer)
        function createFullEngineInstance(ctx, destination) {
            const instanceBus = ctx.createGain();
            instanceBus.gain.setValueAtTime(1.0, ctx.currentTime); // 100% volume output matching real tab behavior
            instanceBus.connect(destination);

            const dryBus = ctx.createGain();
            dryBus.gain.setValueAtTime(0.7, ctx.currentTime);
            dryBus.connect(instanceBus);

            // 1. Independent Reverb Engine
            const convolver = ctx.createConvolver();
            convolver.buffer = createReverbBuffer(ctx);

            const reverbGainNode = ctx.createGain();
            const initRev = parseFloat(document.getElementById('reverbMixRange').value);
            reverbGainNode.gain.setValueAtTime(initRev, ctx.currentTime);

            convolver.connect(reverbGainNode);
            reverbGainNode.connect(instanceBus);

            // 2. Independent Chorus Engine
            const chorusDelay = ctx.createDelay();
            chorusDelay.delayTime.setValueAtTime(0.025, ctx.currentTime);

            const chorusLFO = ctx.createOscillator();
            chorusLFO.frequency.setValueAtTime(0.28 + Math.random() * 0.04, ctx.currentTime);

            const chorusDepth = ctx.createGain();
            chorusDepth.gain.setValueAtTime(0.003, ctx.currentTime);

            chorusLFO.connect(chorusDepth);
            chorusDepth.connect(chorusDelay.delayTime);
            chorusLFO.start();

            const chorusGainNode = ctx.createGain();
            const initChorus = parseFloat(document.getElementById('chorusMixRange').value);
            chorusGainNode.gain.setValueAtTime(initChorus, ctx.currentTime);

            chorusDelay.connect(chorusGainNode);
            chorusGainNode.connect(instanceBus);

            // 3. Independent Mid-Side Stereo Widening Matrix
            const synthOutputBus = ctx.createGain();

            const widthVal = parseFloat(document.getElementById('stereoWidthRange').value);
            const midGainNode = ctx.createGain();
            midGainNode.gain.setValueAtTime(1 - widthVal * 0.25, ctx.currentTime);

            const sideDelay = ctx.createDelay();
            sideDelay.delayTime.setValueAtTime(0.012 + Math.random() * 0.004, ctx.currentTime);

            const sideAllpass = ctx.createBiquadFilter();
            sideAllpass.type = 'allpass';
            sideAllpass.frequency.setValueAtTime(650 + (Math.random() - 0.5) * 40, ctx.currentTime);

            const sideGainNode = ctx.createGain();
            sideGainNode.gain.setValueAtTime(widthVal * 0.85, ctx.currentTime);

            const sideInverter = ctx.createGain();
            sideInverter.gain.setValueAtTime(-1, ctx.currentTime);

            const spatialMerger = ctx.createChannelMerger(2);

            synthOutputBus.connect(midGainNode);
            synthOutputBus.connect(sideDelay);
            sideDelay.connect(sideAllpass);
            sideAllpass.connect(sideGainNode);

            midGainNode.connect(spatialMerger, 0, 0);
            midGainNode.connect(spatialMerger, 0, 1);

            sideGainNode.connect(spatialMerger, 0, 0);
            sideGainNode.connect(sideInverter);
            sideInverter.connect(spatialMerger, 0, 1);

            spatialMerger.connect(dryBus);
            spatialMerger.connect(convolver);
            spatialMerger.connect(chorusDelay);

            // 4. Independent Noise Buffer Generation
            const bufferSize = ctx.sampleRate * 4;
            const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.08;
                b6 = white * 0.115926;
            }

            // 5. Sound Sources (Core Hum, Sub Bass, Pulse, Undulating Wind)
            const noiseSource = ctx.createBufferSource();
            noiseSource.buffer = noiseBuffer;
            noiseSource.loop = true;

            const noiseFilter = ctx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(130, ctx.currentTime);

            noiseSource.connect(noiseFilter);
            noiseFilter.connect(synthOutputBus);

            const detune = (Math.random() - 0.5) * 0.3;
            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            osc1.type = 'sine'; osc2.type = 'sine';
            osc1.frequency.setValueAtTime(58 + detune, ctx.currentTime);
            osc2.frequency.setValueAtTime(58.7 + detune, ctx.currentTime);

            const subGain = ctx.createGain();
            subGain.gain.setValueAtTime(0.3, ctx.currentTime);
            osc1.connect(subGain);
            osc2.connect(subGain);
            subGain.connect(synthOutputBus);

            const pulseOsc = ctx.createOscillator();
            pulseOsc.type = 'sine';
            pulseOsc.frequency.setValueAtTime(78 + detune, ctx.currentTime);

            const pulseGain = ctx.createGain();
            pulseGain.gain.setValueAtTime(0.15, ctx.currentTime);

            const pulseLFO = ctx.createOscillator();
            pulseLFO.frequency.setValueAtTime(0.77 + (Math.random() - 0.5) * 0.04, ctx.currentTime);

            const pulseLFODepth = ctx.createGain();
            pulseLFODepth.gain.setValueAtTime(0.1, ctx.currentTime);

            pulseLFO.connect(pulseLFODepth);
            pulseLFODepth.connect(pulseGain.gain);

            pulseOsc.connect(pulseGain);
            pulseGain.connect(synthOutputBus);

            const windNoiseSource = ctx.createBufferSource();
            windNoiseSource.buffer = noiseBuffer;
            windNoiseSource.loop = true;

            const windFilter = ctx.createBiquadFilter();
            windFilter.type = 'bandpass';
            windFilter.frequency.setValueAtTime(160, ctx.currentTime);
            windFilter.Q.setValueAtTime(1.8, ctx.currentTime);

            const windGain = ctx.createGain();
            windGain.gain.setValueAtTime(0.28, ctx.currentTime);

            const windLFO = ctx.createOscillator();
            windLFO.type = 'sine';
            windLFO.frequency.setValueAtTime(0.13 + (Math.random() - 0.5) * 0.02, ctx.currentTime);

            const windFilterMod = ctx.createGain();
            windFilterMod.gain.setValueAtTime(75, ctx.currentTime);

            const windGainMod = ctx.createGain();
            windGainMod.gain.setValueAtTime(0.12, ctx.currentTime);

            windLFO.connect(windFilterMod);
            windFilterMod.connect(windFilter.frequency);

            windLFO.connect(windGainMod);
            windGainMod.connect(windGain.gain);

            windNoiseSource.connect(windFilter);
            windFilter.connect(windGain);
            windGain.connect(synthOutputBus);

            const offset1 = Math.random() * noiseBuffer.duration;
            const offset2 = Math.random() * noiseBuffer.duration;
            noiseSource.start(0, offset1);
            osc1.start();
            osc2.start();
            pulseOsc.start();
            pulseLFO.start();
            windNoiseSource.start(0, offset2);
            windLFO.start();

            return {
                synthOutputBus,
                midGainNode,
                sideGainNode,
                reverbGainNode,
                chorusGainNode,
                stop: () => {
                    try { noiseSource.stop(); } catch(e) {}
                    try { osc1.stop(); } catch(e) {}
                    try { osc2.stop(); } catch(e) {}
                    try { pulseOsc.stop(); } catch(e) {}
                    try { pulseLFO.stop(); } catch(e) {}
                    try { windNoiseSource.stop(); } catch(e) {}
                    try { windLFO.stop(); } catch(e) {}
                    try { chorusLFO.stop(); } catch(e) {}
                    setTimeout(() => { instanceBus.disconnect(); }, 50);
                }
            };
        }

        function updateAllInstances(param, value) {
            const allInstances = [mainEngineInstance, ...duplicateEngineInstances].filter(Boolean);
            const now = audioCtx ? audioCtx.currentTime : 0;

            allInstances.forEach(inst => {
                if (param === 'width' && inst.midGainNode && inst.sideGainNode) {
                    inst.midGainNode.gain.setValueAtTime(1 - value * 0.25, now);
                    inst.sideGainNode.gain.setValueAtTime(value * 0.85, now);
                } else if (param === 'reverb' && inst.reverbGainNode) {
                    inst.reverbGainNode.gain.setValueAtTime(value, now);
                } else if (param === 'chorus' && inst.chorusGainNode) {
                    inst.chorusGainNode.gain.setValueAtTime(value, now);
                }
            });
        }

        function syncDuplicateInstances(targetCount) {
            if (!audioCtx || !masterGain) return;

            while (duplicateEngineInstances.length < targetCount) {
                duplicateEngineInstances.push(createFullEngineInstance(audioCtx, masterGain));
            }
            while (duplicateEngineInstances.length > targetCount) {
                const inst = duplicateEngineInstances.pop();
                if (inst) inst.stop();
            }
        }

        function initSynthesizer() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            masterGain.connect(audioCtx.destination);

            // Primary Tab Instance
            mainEngineInstance = createFullEngineInstance(audioCtx, masterGain);

            // Duplicate Tab Instances
            const initPhaseDup = parseInt(document.getElementById('phaseDupRange').value);
            syncDuplicateInstances(initPhaseDup);

            // Muffled Industrial Cooling Layer (Single Global High Layer)
            hiFreqGain = audioCtx.createGain();
            hiFreqBaseVol = parseFloat(document.getElementById('hiVolRange').value);
            hiFreqGain.gain.setValueAtTime(hiFreqEnabled ? hiFreqBaseVol : 0, audioCtx.currentTime);

            hiDampingFilter = audioCtx.createBiquadFilter();
            hiDampingFilter.type = 'lowpass';
            hiDampingFilter.frequency.setValueAtTime(1200, audioCtx.currentTime);

            hiFreqGain.connect(hiDampingFilter);
            hiDampingFilter.connect(masterGain);

            const pVal = parseFloat(document.getElementById('hiPitchRange').value);
            const sVal = parseFloat(document.getElementById('hiSpeedRange').value);

            // High Noise Buffer Generator
            const bufferSize = audioCtx.sampleRate * 4;
            const hiNoiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = hiNoiseBuffer.getChannelData(0);
            let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.08;
                b6 = white * 0.115926;
            }

            const hiNoiseSource = audioCtx.createBufferSource();
            hiNoiseSource.buffer = hiNoiseBuffer;
            hiNoiseSource.loop = true;

            hiResFilter1 = audioCtx.createBiquadFilter();
            hiResFilter1.type = 'bandpass';
            hiResFilter1.Q.setValueAtTime(22, audioCtx.currentTime);

            hiResFilter2 = audioCtx.createBiquadFilter();
            hiResFilter2.type = 'bandpass';
            hiResFilter2.Q.setValueAtTime(26, audioCtx.currentTime);

            hiResFilter3 = audioCtx.createBiquadFilter();
            hiResFilter3.type = 'bandpass';
            hiResFilter3.Q.setValueAtTime(18, audioCtx.currentTime);

            hiResFilter1.frequency.setValueAtTime(380 * pVal, audioCtx.currentTime);
            hiResFilter2.frequency.setValueAtTime(740 * pVal, audioCtx.currentTime);
            hiResFilter3.frequency.setValueAtTime(1290 * pVal, audioCtx.currentTime);

            hiNoiseSource.connect(hiResFilter1);
            hiNoiseSource.connect(hiResFilter2);
            hiNoiseSource.connect(hiResFilter3);

            hiResFilter1.connect(hiFreqGain);
            hiResFilter2.connect(hiFreqGain);
            hiResFilter3.connect(hiFreqGain);

            hiOsc1 = audioCtx.createOscillator();
            hiOsc2 = audioCtx.createOscillator();
            hiOsc1.type = 'triangle';
            hiOsc2.type = 'triangle';

            hiOsc1.frequency.setValueAtTime(260 * pVal, audioCtx.currentTime);
            hiOsc2.frequency.setValueAtTime(415 * pVal, audioCtx.currentTime);

            const hiOscGain = audioCtx.createGain();
            hiOscGain.gain.setValueAtTime(0.08, audioCtx.currentTime);

            hiOsc1.connect(hiOscGain);
            hiOsc2.connect(hiOscGain);

            hiLFO = audioCtx.createOscillator();
            hiLFO.frequency.setValueAtTime(sVal, audioCtx.currentTime);

            const hiLFODepth = audioCtx.createGain();
            hiLFODepth.gain.setValueAtTime(0.04, audioCtx.currentTime);

            hiLFO.connect(hiLFODepth);
            hiLFODepth.connect(hiOscGain.gain);

            hiOscGain.connect(hiFreqGain);

            hiNoiseSource.start();
            hiOsc1.start();
            hiOsc2.start();
            hiLFO.start();
        }

        // --- Dynamic Control Listeners ---
        document.getElementById('phaseDupRange').addEventListener('input', (e) => {
            const count = parseInt(e.target.value);
            document.getElementById('phaseDupDisplay').textContent = count;
            syncDuplicateInstances(count);
        });

        document.getElementById('stereoWidthRange').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('widthDisplay').textContent = Math.round(val * 100) + '%';
            updateAllInstances('width', val);
        });

        document.getElementById('reverbMixRange').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('reverbDisplay').textContent = Math.round(val * 100) + '%';
            updateAllInstances('reverb', val);
        });

        document.getElementById('chorusMixRange').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('chorusDisplay').textContent = Math.round(val * 100) + '%';
            updateAllInstances('chorus', val);
        });

        const hiFreqToggleEl = document.getElementById('hiFreqToggle');
        hiFreqToggleEl.addEventListener('click', function() {
            hiFreqEnabled = !hiFreqEnabled;
            this.classList.toggle('active');
            this.setAttribute('aria-checked', String(hiFreqEnabled));
            if (audioCtx && hiFreqGain) {
                hiFreqGain.gain.setValueAtTime(hiFreqEnabled ? hiFreqBaseVol : 0, audioCtx.currentTime);
            }
        });

        document.getElementById('hiVolRange').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            hiFreqBaseVol = val;
            document.getElementById('hiVolDisplay').textContent = Math.round(val * 100) + '%';
            if (audioCtx && hiFreqGain && hiFreqEnabled) {
                hiFreqGain.gain.setValueAtTime(val, audioCtx.currentTime);
            }
        });

        document.getElementById('hiPitchRange').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('hiPitchDisplay').textContent = val.toFixed(2) + 'x';
            if (audioCtx && hiResFilter1) {
                const now = audioCtx.currentTime;
                hiResFilter1.frequency.setValueAtTime(380 * val, now);
                hiResFilter2.frequency.setValueAtTime(740 * val, now);
                hiResFilter3.frequency.setValueAtTime(1290 * val, now);
                if (hiOsc1) hiOsc1.frequency.setValueAtTime(260 * val, now);
                if (hiOsc2) hiOsc2.frequency.setValueAtTime(415 * val, now);
                if (hiDampingFilter) hiDampingFilter.frequency.setValueAtTime(1200 * Math.min(1.5, val), now);
            }
        });

        document.getElementById('hiSpeedRange').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('hiSpeedDisplay').textContent = val.toFixed(1) + ' Hz';
            if (audioCtx && hiLFO) {
                hiLFO.frequency.setValueAtTime(val, audioCtx.currentTime);
            }
        });

        const soundToggleEl = document.getElementById('soundToggle');
        soundToggleEl.addEventListener('click', async function() {
            if (!audioCtx) {
                initSynthesizer();
                this.classList.add('active');
            } else if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
                this.classList.add('active');
            } else if (audioCtx.state === 'running') {
                await audioCtx.suspend();
                this.classList.remove('active');
            }
            this.setAttribute('aria-checked', String(this.classList.contains('active')));
        });

        // Keyboard support for the visual switches (Space / Enter)
        [trailsToggle, hiFreqToggleEl, soundToggleEl].forEach((el) => {
            el.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    el.click();
                }
            });
        });

        // --- Settings: persist to localStorage, restore on launch, reset to defaults ---
        const SETTINGS_KEY = 'warp.settings.v1';
        const sliderIds = [
            'speedRange', 'countRange', 'aberrationRange', 'edgeGlowRange',
            'phaseDupRange', 'stereoWidthRange', 'reverbMixRange', 'chorusMixRange',
            'hiVolRange', 'hiPitchRange', 'hiSpeedRange'
        ];
        const toggleIds = ['trailsToggle', 'soundToggle', 'hiFreqToggle'];

        const syncToggleAria = () => {
            toggleIds.forEach((id) => {
                const el = document.getElementById(id);
                el.setAttribute('aria-checked', String(el.classList.contains('active')));
            });
        };

        const saveSettings = () => {
            try {
                const s = {};
                sliderIds.forEach((id) => { s[id] = document.getElementById(id).value; });
                toggleIds.forEach((id) => { s[id] = document.getElementById(id).classList.contains('active'); });
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
            } catch (e) { /* storage unavailable (private mode etc.) */ }
        };

        const restoreSettings = () => {
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem(SETTINGS_KEY)); } catch (e) {}
            if (!saved || typeof saved !== 'object') return;

            // Re-dispatching 'input' runs each control's existing handler
            // (display text + runtime state), so nothing is duplicated.
            sliderIds.forEach((id) => {
                const el = document.getElementById(id);
                if (typeof saved[id] === 'string' && !Number.isNaN(parseFloat(saved[id]))) {
                    el.value = saved[id];
                    el.dispatchEvent(new Event('input'));
                }
            });
            toggleIds.forEach((id) => {
                const el = document.getElementById(id);
                if (typeof saved[id] === 'boolean') el.classList.toggle('active', saved[id]);
            });
            syncToggleAria();

            // Runtime flags that don't flow through an input event
            showTrails = document.getElementById('trailsToggle').classList.contains('active');
            hiFreqEnabled = document.getElementById('hiFreqToggle').classList.contains('active');

            // Audio cannot start before the user's first gesture — if sound
            // was on, start it then (the sliders already hold the saved params).
            if (document.getElementById('soundToggle').classList.contains('active')) {
                const startAudio = () => {
                    if (!audioCtx) initSynthesizer();
                    window.removeEventListener('pointerdown', startAudio);
                    window.removeEventListener('keydown', startAudio);
                };
                window.addEventListener('pointerdown', startAudio);
                window.addEventListener('keydown', startAudio);
            }
        };

        const resetSettings = () => {
            try { localStorage.removeItem(SETTINGS_KEY); } catch (e) {}
            sliderIds.forEach((id) => {
                const el = document.getElementById(id);
                el.value = el.defaultValue; // default as written in the markup
                el.dispatchEvent(new Event('input'));
            });
            toggleIds.forEach((id) => { document.getElementById(id).classList.remove('active'); });
            syncToggleAria();
            showTrails = false;
            hiFreqEnabled = false;

            // Bring the live audio graph back in line with the restored defaults
            if (audioCtx) {
                if (hiFreqGain) hiFreqGain.gain.setValueAtTime(0, audioCtx.currentTime);
                if (audioCtx.state === 'running') audioCtx.suspend();
            }
        };

        restoreSettings();

        document.getElementById('resetBtn').addEventListener('click', resetSettings);
        document.getElementById('versionTag').textContent = 'v' + APP_VERSION;

        updateStarCount();
        animate();

        // --- Control panel: opened from the tiny icon in the top-right,
        //     auto-hides again once idle ---
        const settingsPanel = document.querySelector('.settings');
        const panelToggle = document.getElementById('panelToggle');
        const SETTINGS_IDLE_MS = 8000;
        const PEAK_OPACITY = 0.4;  // how visible the icon gets on pointer activity
        const PEAK_HOLD_MS = 2000; // how long the peek holds after the last move
        let settingsHideTimer = null;
        let peakTimer = null;

        settingsPanel.inert = true; // hidden panel stays out of the tab order

        const openPanel = () => {
            settingsPanel.classList.add('open');
            settingsPanel.inert = false;
            document.body.classList.add('panel-open');
            panelToggle.setAttribute('aria-expanded', 'true');
            panelToggle.style.opacity = ''; // the panel-open CSS state takes over
            clearTimeout(settingsHideTimer);
            settingsHideTimer = setTimeout(closePanel, SETTINGS_IDLE_MS);
        };

        const closePanel = () => {
            clearTimeout(settingsHideTimer);
            clearTimeout(peakTimer);
            settingsPanel.classList.remove('open');
            settingsPanel.inert = true;
            document.body.classList.remove('panel-open');
            panelToggle.setAttribute('aria-expanded', 'false');
            panelToggle.style.opacity = '';
        };

        // Progressive reveal: the faint mixer icon "peeks" a little brighter
        // while the pointer moves over the scene, then fades back to rest.
        const peekToggle = () => {
            if (document.body.classList.contains('panel-open')) return;
            panelToggle.style.opacity = PEAK_OPACITY;
            clearTimeout(peakTimer);
            peakTimer = setTimeout(() => { panelToggle.style.opacity = ''; }, PEAK_HOLD_MS);
        };

        panelToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            if (settingsPanel.classList.contains('open')) closePanel();
            else openPanel();
        });

        settingsPanel.addEventListener('click', (e) => {
            openPanel(); // resets the idle timer
            if (e.target.classList.contains('toggle')) saveSettings();
        });
        settingsPanel.addEventListener('input', saveSettings);
        settingsPanel.addEventListener('pointermove', openPanel);
        settingsPanel.addEventListener('focusin', openPanel);

        canvas.addEventListener('pointermove', peekToggle);
        canvas.addEventListener('pointerdown', peekToggle);

        document.addEventListener('click', (e) => {
            if (!settingsPanel.contains(e.target)) closePanel();
        });

        // --- PWA: Install CTA (first launch, dismissible) ---
        const installCta = document.getElementById('installCta');
        const installCtaCard = document.getElementById('installCtaCard');
        const installCtaTitle = document.getElementById('installCtaTitle');
        const installCtaSub = document.getElementById('installCtaSub');
        const installCtaInstallBtn = document.getElementById('installCtaInstall');
        const installCtaDismissBtn = document.getElementById('installCtaDismiss');
        const CTA_DISMISSED_KEY = 'warp.installCta.dismissed.v1';

        let deferredPrompt = null;

        const isStandalone = () =>
            window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: window-controls-overlay)').matches ||
            window.navigator.standalone === true;

        const isIOS = () =>
            /iphone|ipad|ipod/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        const wasDismissed = () => {
            try { return localStorage.getItem(CTA_DISMISSED_KEY) === '1'; } catch (e) { return true; }
        };

        const markDismissed = () => {
            try { localStorage.setItem(CTA_DISMISSED_KEY, '1'); } catch (e) { /* private mode */ }
        };

        installCta.inert = true; // hidden CTA stays out of the tab order

        const hideCta = () => {
            installCta.classList.remove('visible');
            installCta.inert = true;
        };

        const showCta = () => {
            if (isStandalone() || wasDismissed()) return;
            installCta.classList.add('visible');
            installCta.inert = false;
        };

        /* Chrome/Edge/Firefox hand us the real install prompt. */
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(showCta, 900);
        });

        /* iOS Safari has no beforeinstallprompt: show a how-to hint instead. */
        if (isIOS() && !isStandalone()) {
            installCtaTitle.textContent = 'Add Warp to your home screen';
            installCtaSub.textContent = 'Tap Share, then “Add to Home Screen”';
            installCtaInstallBtn.style.display = 'none';
            setTimeout(showCta, 900);
        }

        window.addEventListener('appinstalled', () => {
            markDismissed();
            deferredPrompt = null;
            hideCta();
        });

        installCtaInstallBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (!deferredPrompt || typeof deferredPrompt.prompt !== 'function') return;
            try {
                deferredPrompt.prompt();
                const choice = await deferredPrompt.userChoice;
                deferredPrompt = null;
                if (choice.outcome === 'accepted') {
                    markDismissed();
                    hideCta();
                }
            } catch (err) {
                console.warn('Install prompt failed:', err);
            }
        });

        installCtaDismissBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            markDismissed();
            hideCta();
        });

        /* Tapping anywhere else on the card dismisses it too. */
        installCtaCard.addEventListener('click', () => {
            markDismissed();
            hideCta();
        });

        // --- PWA: Service Worker registration (offline support) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.warn('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
