<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Trek - TNG - Tenforward</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .settings {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            z-index: 10;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 1.2rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 92vw;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0.05;
        }

        .settings:hover {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        .setting-group label {
            color: rgba(255, 255, 255, 0.7);
        }

        input[type="range"] {
            width: 85px;
            accent-color: #fff;
        }

        .display-val {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            min-width: 40px;
        }

        .toggle {
            width: 40px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            transition: left 0.3s;
        }

        .toggle.active {
            background: rgba(255, 255, 255, 0.6);
        }

        .toggle.active::after {
            left: 22px;
        }
    </style>
</head>
<body>
    <canvas id="warpCanvas"></canvas>

    <div class="settings">
        <!-- Visual Controls -->
        <div class="setting-group">
            <label for="speedRange">Speed</label>
            <input type="range" id="speedRange" min="1" max="20" value="15">
            <span class="display-val" id="speedDisplay">15x</span>
        </div>

        <div class="setting-group">
            <label for="countRange">Stars</label>
            <input type="range" id="countRange" min="100" max="2000" step="100" value="800">
            <span class="display-val" id="countDisplay">800</span>
        </div>

        <div class="setting-group">
            <label for="trailsToggle">Trails</label>
            <div class="toggle" id="trailsToggle"></div>
        </div>

        <!-- Audio Toggle & Spatial Controls -->
        <div class="setting-group">
            <label for="soundToggle">Sound</label>
            <div class="toggle" id="soundToggle"></div>
        </div>

        <div class="setting-group">
            <label for="stereoWidthRange">Sound Width</label>
            <input type="range" id="stereoWidthRange" min="0" max="1" step="0.05" value="0.80">
            <span class="display-val" id="widthDisplay">80%</span>
        </div>

        <div class="setting-group">
            <label for="reverbMixRange">Reverb Room</label>
            <input type="range" id="reverbMixRange" min="0" max="1" step="0.05" value="1.0">
            <span class="display-val" id="reverbDisplay">100%</span>
        </div>

        <div class="setting-group">
            <label for="chorusMixRange">Chorus Motion</label>
            <input type="range" id="chorusMixRange" min="0" max="1" step="0.05" value="0.80">
            <span class="display-val" id="chorusDisplay">80%</span>
        </div>

        <!-- Industrial Cooling Layer Controls -->
        <div class="setting-group">
            <label for="hiFreqToggle">Hi-Layer</label>
            <div class="toggle" id="hiFreqToggle"></div>
        </div>

        <div class="setting-group">
            <label for="hiVolRange">Hi Vol</label>
            <input type="range" id="hiVolRange" min="0" max="1" step="0.05" value="0.25">
            <span class="display-val" id="hiVolDisplay">25%</span>
        </div>

        <div class="setting-group">
            <label for="hiPitchRange">Hi Pitch</label>
            <input type="range" id="hiPitchRange" min="0.5" max="3.0" step="0.05" value="0.50">
            <span class="display-val" id="hiPitchDisplay">0.50x</span>
        </div>

        <div class="setting-group">
            <label for="hiSpeedRange">Hi Speed</label>
            <input type="range" id="hiSpeedRange" min="0.1" max="4.0" step="0.1" value="0.1">
            <span class="display-val" id="hiSpeedDisplay">0.1 Hz</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('warpCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, centerX, centerY;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        let STAR_COUNT = 800;
        let MAX_DEPTH = 1500;
        const FOCAL_LENGTH = 400;
        let speed = 15;
        let showTrails = false;

        class Star {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = (Math.random() - 0.5) * width * 3;
                this.y = (Math.random() - 0.5) * height * 3;
                this.z = initial ? Math.random() * MAX_DEPTH : MAX_DEPTH;
                this.px = centerX + (this.x / this.z) * FOCAL_LENGTH;
                this.py = centerY + (this.y / this.z) * FOCAL_LENGTH;
            }
            update() {
                this.px = centerX + (this.x / this.z) * FOCAL_LENGTH;
                this.py = centerY + (this.y / this.z) * FOCAL_LENGTH;
                this.z -= speed;
                if (this.z <= 0) this.reset(false);
            }
            draw() {
                const sx = centerX + (this.x / this.z) * FOCAL_LENGTH;
                const sy = centerY + (this.y / this.z) * FOCAL_LENGTH;
                if (sx < 0 || sx > width || sy < 0 || sy > height) return;
                const closeness = 1 - (this.z / MAX_DEPTH);
                const alpha = Math.min(1, closeness * 1.5);
                const strokeWidth = Math.max(0.5, closeness * 3);

                ctx.beginPath();
                ctx.moveTo(this.px, this.py);
                ctx.lineTo(sx, sy);
                ctx.strokeStyle = `rgba(220, 240, 255, ${alpha})`;
                ctx.lineWidth = strokeWidth;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        }

        let stars = [];
        function updateStarCount() {
            const newCount = parseInt(document.getElementById('countRange').value);
            STAR_COUNT = newCount;
            while (stars.length > STAR_COUNT) stars.pop();
            while (stars.length < STAR_COUNT) stars.push(new Star());
            document.getElementById('countDisplay').textContent = STAR_COUNT;
        }

        function animate() {
            ctx.fillStyle = showTrails ? 'rgba(0, 0, 0, 0.25)' : '#000000';
            ctx.fillRect(0, 0, width, height);
            for (let star of stars) {
                star.update();
                star.draw();
            }
            requestAnimationFrame(animate);
        }

        document.getElementById('speedRange').addEventListener('input', (e) => {
            speed = parseInt(e.target.value);
            document.getElementById('speedDisplay').textContent = speed + 'x';
        });

        document.getElementById('countRange').addEventListener('input', updateStarCount);

        const trailsToggle = document.getElementById('trailsToggle');
        trailsToggle.addEventListener('click', function() {
            showTrails = !showTrails;
            this.classList.toggle('active');
        });

        // --- Audio Architecture ---
        let audioCtx = null;
        let masterGain = null;
        let reverbGainNode = null;
        let chorusGainNode = null;

        // Stereo Spatializer
        let midGainNode = null;
        let sideGainNode = null;

        // Industrial Cooling Ring Layer
        let hiFreqEnabled = false;
        let hiFreqGain = null;
        let hiFreqBaseVol = 0.25;
        let hiDampingFilter = null;
        let hiResFilter1 = null, hiResFilter2 = null, hiResFilter3 = null;
        let hiOsc1 = null, hiOsc2 = null, hiLFO = null;

        function createReverbBuffer(ctx) {
            const duration = 1.2;
            const sampleRate = ctx.sampleRate;
            const length = sampleRate * duration;
            const impulse = ctx.createBuffer(2, length, sampleRate);
            const left = impulse.getChannelData(0);
            const right = impulse.getChannelData(1);

            for (let i = 0; i < length; i++) {
                const decay = Math.exp(-i / (sampleRate * 0.15));
                left[i] = (Math.random() * 2 - 1) * decay;
                right[i] = (Math.random() * 2 - 1) * decay;
            }
            return impulse;
        }

        function initSynthesizer() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            masterGain.connect(audioCtx.destination);

            const dryBus = audioCtx.createGain();
            dryBus.gain.setValueAtTime(0.7, audioCtx.currentTime);
            dryBus.connect(masterGain);

            // Reverb Engine
            const convolver = audioCtx.createConvolver();
            convolver.buffer = createReverbBuffer(audioCtx);

            reverbGainNode = audioCtx.createGain();
            const initRev = parseFloat(document.getElementById('reverbMixRange').value);
            reverbGainNode.gain.setValueAtTime(initRev, audioCtx.currentTime);

            convolver.connect(reverbGainNode);
            reverbGainNode.connect(masterGain);

            // Chorus Engine
            const chorusDelay = audioCtx.createDelay();
            chorusDelay.delayTime.setValueAtTime(0.025, audioCtx.currentTime);

            const chorusLFO = audioCtx.createOscillator();
            chorusLFO.frequency.setValueAtTime(0.3, audioCtx.currentTime);

            const chorusDepth = audioCtx.createGain();
            chorusDepth.gain.setValueAtTime(0.003, audioCtx.currentTime);

            chorusLFO.connect(chorusDepth);
            chorusDepth.connect(chorusDelay.delayTime);
            chorusLFO.start();

            chorusGainNode = audioCtx.createGain();
            const initChorus = parseFloat(document.getElementById('chorusMixRange').value);
            chorusGainNode.gain.setValueAtTime(initChorus, audioCtx.currentTime);

            chorusDelay.connect(chorusGainNode);
            chorusGainNode.connect(masterGain);

            // --- Mid-Side Stereo Widening Matrix ---
            const synthOutputBus = audioCtx.createGain();

            const widthVal = parseFloat(document.getElementById('stereoWidthRange').value);
            midGainNode = audioCtx.createGain();
            midGainNode.gain.setValueAtTime(1 - widthVal * 0.25, audioCtx.currentTime);

            const sideDelay = audioCtx.createDelay();
            sideDelay.delayTime.setValueAtTime(0.014, audioCtx.currentTime);

            const sideAllpass = audioCtx.createBiquadFilter();
            sideAllpass.type = 'allpass';
            sideAllpass.frequency.setValueAtTime(650, audioCtx.currentTime);

            sideGainNode = audioCtx.createGain();
            sideGainNode.gain.setValueAtTime(widthVal * 0.85, audioCtx.currentTime);

            const sideInverter = audioCtx.createGain();
            sideInverter.gain.setValueAtTime(-1, audioCtx.currentTime);

            const spatialMerger = audioCtx.createChannelMerger(2);

            synthOutputBus.connect(midGainNode);
            synthOutputBus.connect(sideDelay);
            sideDelay.connect(sideAllpass);
            sideAllpass.connect(sideGainNode);

            midGainNode.connect(spatialMerger, 0, 0);
            midGainNode.connect(spatialMerger, 0, 1);

            sideGainNode.connect(spatialMerger, 0, 0);
            sideGainNode.connect(sideInverter);
            sideInverter.connect(spatialMerger, 0, 1);

            spatialMerger.connect(dryBus);
            spatialMerger.connect(convolver);
            spatialMerger.connect(chorusDelay);

            // Noise Buffer Generator
            const bufferSize = audioCtx.sampleRate * 4;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.08;
                b6 = white * 0.115926;
            }

            // --- Core Engine Hum ---
            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = noiseBuffer;
            noiseSource.loop = true;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(130, audioCtx.currentTime);

            noiseSource.connect(noiseFilter);
            noiseFilter.connect(synthOutputBus);

            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            osc1.type = 'sine'; osc2.type = 'sine';
            osc1.frequency.setValueAtTime(58, audioCtx.currentTime);
            osc2.frequency.setValueAtTime(58.7, audioCtx.currentTime);

            const subGain = audioCtx.createGain();
            subGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc1.connect(subGain);
            osc2.connect(subGain);
            subGain.connect(synthOutputBus);

            const pulseOsc = audioCtx.createOscillator();
            pulseOsc.type = 'sine';
            pulseOsc.frequency.setValueAtTime(78, audioCtx.currentTime);

            const pulseGain = audioCtx.createGain();
            pulseGain.gain.setValueAtTime(0.15, audioCtx.currentTime);

            const pulseLFO = audioCtx.createOscillator();
            pulseLFO.frequency.setValueAtTime(0.77, audioCtx.currentTime);

            const pulseLFODepth = audioCtx.createGain();
            pulseLFODepth.gain.setValueAtTime(0.1, audioCtx.currentTime);

            pulseLFO.connect(pulseLFODepth);
            pulseLFODepth.connect(pulseGain.gain);

            pulseOsc.connect(pulseGain);
            pulseGain.connect(synthOutputBus);

            noiseSource.start();
            osc1.start();
            osc2.start();
            pulseOsc.start();
            pulseLFO.start();

            // --- Undulating Low-Wind Layer (Upper Bass Air Sweeps) ---
            const windNoiseSource = audioCtx.createBufferSource();
            windNoiseSource.buffer = noiseBuffer;
            windNoiseSource.loop = true;

            const windFilter = audioCtx.createBiquadFilter();
            windFilter.type = 'bandpass';
            windFilter.frequency.setValueAtTime(160, audioCtx.currentTime);
            windFilter.Q.setValueAtTime(1.8, audioCtx.currentTime);

            const windGain = audioCtx.createGain();
            windGain.gain.setValueAtTime(0.28, audioCtx.currentTime);

            const windLFO = audioCtx.createOscillator();
            windLFO.type = 'sine';
            windLFO.frequency.setValueAtTime(0.13, audioCtx.currentTime); // Out-of-phase rate (~7.7s cycle)

            const windFilterMod = audioCtx.createGain();
            windFilterMod.gain.setValueAtTime(75, audioCtx.currentTime); // Cutoff sweeps 85 Hz - 235 Hz

            const windGainMod = audioCtx.createGain();
            windGainMod.gain.setValueAtTime(0.12, audioCtx.currentTime);

            windLFO.connect(windFilterMod);
            windFilterMod.connect(windFilter.frequency);

            windLFO.connect(windGainMod);
            windGainMod.connect(windGain.gain);

            windNoiseSource.connect(windFilter);
            windFilter.connect(windGain);
            windGain.connect(synthOutputBus);

            windNoiseSource.start();
            windLFO.start();

            // --- Muffled Industrial Cooling Layer ---
            hiFreqGain = audioCtx.createGain();
            hiFreqBaseVol = parseFloat(document.getElementById('hiVolRange').value);
            hiFreqGain.gain.setValueAtTime(hiFreqEnabled ? hiFreqBaseVol : 0, audioCtx.currentTime);

            hiDampingFilter = audioCtx.createBiquadFilter();
            hiDampingFilter.type = 'lowpass';
            hiDampingFilter.frequency.setValueAtTime(1200, audioCtx.currentTime);

            hiFreqGain.connect(hiDampingFilter);
            hiDampingFilter.connect(synthOutputBus);

            const pVal = parseFloat(document.getElementById('hiPitchRange').value);
            const sVal = parseFloat(document.getElementById('hiSpeedRange').value);

            const hiNoiseSource = audioCtx.createBufferSource();
            hiNoiseSource.buffer = noiseBuffer;
            hiNoiseSource.loop = true;

            hiResFilter1 = audioCtx.createBiquadFilter();
            hiResFilter1.type = 'bandpass';
            hiResFilter1.Q.setValueAtTime(22, audioCtx.currentTime);

            hiResFilter2 = audioCtx.createBiquadFilter();
            hiResFilter2.type = 'bandpass';
            hiResFilter2.Q.setValueAtTime(26, audioCtx.currentTime);

            hiResFilter3 = audioCtx.createBiquadFilter();
            hiResFilter3.type = 'bandpass';
            hiResFilter3.Q.setValueAtTime(18, audioCtx.currentTime);

            hiResFilter1.frequency.setValueAtTime(380 * pVal, audioCtx.currentTime);
            hiResFilter2.frequency.setValueAtTime(740 * pVal, audioCtx.currentTime);
            hiResFilter3.frequency.setValueAtTime(1290 * pVal, audioCtx.currentTime);

            hiNoiseSource.connect(hiResFilter1);
            hiNoiseSource.connect(hiResFilter2);
            hiNoiseSource.connect(hiResFilter3);

            hiResFilter1.connect(hiFreqGain);
            hiResFilter2.connect(hiFreqGain);
            hiResFilter3.connect(hiFreqGain);

            hiOsc1 = audioCtx.createOscillator();
            hiOsc2 = audioCtx.createOscillator();
            hiOsc1.type = 'triangle';
            hiOsc2.type = 'triangle';

            hiOsc1.frequency.setValueAtTime(260 * pVal, audioCtx.currentTime);
            hiOsc2.frequency.setValueAtTime(415 * pVal, audioCtx.currentTime);

            const hiOscGain = audioCtx.createGain();
            hiOscGain.gain.setValueAtTime(0.08, audioCtx.currentTime);

            hiOsc1.connect(hiOscGain);
            hiOsc2.connect(hiOscGain);

            hiLFO = audioCtx.createOscillator();
            hiLFO.frequency.setValueAtTime(sVal, audioCtx.currentTime);

            const hiLFODepth = audioCtx.createGain();
            hiLFODepth.gain.setValueAtTime(0.04, audioCtx.currentTime);

            hiLFO.connect(hiLFODepth);
            hiLFODepth.connect(hiOscGain.gain);

            hiOscGain.connect(hiFreqGain);

            hiNoiseSource.start();
            hiOsc1.start();
            hiOsc2.start();
            hiLFO.start();
        }

        // --- Dynamic Control Listeners ---
        document.getElementById('stereoWidthRange').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('widthDisplay').textContent = Math.round(val * 100) + '%';
            if (audioCtx && midGainNode && sideGainNode) {
                const now = audioCtx.currentTime;
                midGainNode.gain.setValueAtTime(1 - val * 0.25, now);
                sideGainNode.gain.setValueAtTime(val * 0.85, now);
            }
        });

        document.getElementById('reverbMixRange').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('reverbDisplay').textContent = Math.round(val * 100) + '%';
            if (audioCtx && reverbGainNode) {
                reverbGainNode.gain.setValueAtTime(val, audioCtx.currentTime);
            }
        });

        document.getElementById('chorusMixRange').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('chorusDisplay').textContent = Math.round(val * 100) + '%';
            if (audioCtx && chorusGainNode) {
                chorusGainNode.gain.setValueAtTime(val, audioCtx.currentTime);
            }
        });

        const hiFreqToggleEl = document.getElementById('hiFreqToggle');
        hiFreqToggleEl.addEventListener('click', function() {
            hiFreqEnabled = !hiFreqEnabled;
            this.classList.toggle('active');
            if (audioCtx && hiFreqGain) {
                hiFreqGain.gain.setValueAtTime(hiFreqEnabled ? hiFreqBaseVol : 0, audioCtx.currentTime);
            }
        });

        document.getElementById('hiVolRange').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            hiFreqBaseVol = val;
            document.getElementById('hiVolDisplay').textContent = Math.round(val * 100) + '%';
            if (audioCtx && hiFreqGain && hiFreqEnabled) {
                hiFreqGain.gain.setValueAtTime(val, audioCtx.currentTime);
            }
        });

        document.getElementById('hiPitchRange').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('hiPitchDisplay').textContent = val.toFixed(2) + 'x';
            if (audioCtx && hiResFilter1) {
                const now = audioCtx.currentTime;
                hiResFilter1.frequency.setValueAtTime(380 * val, now);
                hiResFilter2.frequency.setValueAtTime(740 * val, now);
                hiResFilter3.frequency.setValueAtTime(1290 * val, now);
                if (hiOsc1) hiOsc1.frequency.setValueAtTime(260 * val, now);
                if (hiOsc2) hiOsc2.frequency.setValueAtTime(415 * val, now);
                if (hiDampingFilter) hiDampingFilter.frequency.setValueAtTime(1200 * Math.min(1.5, val), now);
            }
        });

        document.getElementById('hiSpeedRange').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('hiSpeedDisplay').textContent = val.toFixed(1) + ' Hz';
            if (audioCtx && hiLFO) {
                hiLFO.frequency.setValueAtTime(val, audioCtx.currentTime);
            }
        });

        const soundToggleEl = document.getElementById('soundToggle');
        soundToggleEl.addEventListener('click', async function() {
            if (!audioCtx) {
                initSynthesizer();
                this.classList.add('active');
                return;
            }

            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
                this.classList.add('active');
            } else if (audioCtx.state === 'running') {
                await audioCtx.suspend();
                this.classList.remove('active');
            }
        });

        updateStarCount();
        animate();
    </script>
</body>
</html>
